<h1>Dashboard</h1>

<div *ngIf="dashboardStats$ | async as stats" class="stats-grid">
  <app-card>
    <div class="stat-card-content">
      <span class="stat-title">Total Workflows</span>
      <span class="stat-value">{{ stats.totalWorkflows }}</span>
    </div>
  </app-card>
  <app-card>
    <div class="stat-card-content">
      <span class="stat-title">Enabled Workflows</span>
      <span class="stat-value">{{ stats.enabledWorkflows }}</span>
    </div>
  </app-card>
  <app-card>
    <div class="stat-card-content">
      <span class="stat-title">Executions (24h)</span>
      <span class="stat-value">{{ stats.totalExecutions24h }}</span>
    </div>
  </app-card>
  <app-card>
    <div class="stat-card-content">
      <span class="stat-title">Failed (24h)</span>
      <span class="stat-value">{{ stats.failedExecutions24h }}</span>
    </div>
  </app-card>
</div>
