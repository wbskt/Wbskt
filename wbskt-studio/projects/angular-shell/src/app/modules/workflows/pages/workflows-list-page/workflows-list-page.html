<div class="page-header">
  <h1>Workflows</h1>
  <app-button variant="primary">Create Workflow</app-button>
</div>

<div class="content-area">
  <ul *ngIf="workflows$ | async as workflows">
    <li *ngFor="let workflow of workflows">
      {{ workflow.name }} ({{ workflow.isEnabled ? 'Enabled' : 'Disabled' }})
    </li>
  </ul>
  <p *ngIf="!(workflows$ | async)?.length">No workflows found.</p>
</div>
