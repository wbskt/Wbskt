name: Nightly conformance

# Runs Tests/Conformance/test_live.py with the .NET harness (wbskt/Wbskt.DotNet master) against the real hosts, started from
# source as in nightly-stress.yml (the setup is copied from there; keep them in step). The pull-request
# suite (sdk-conformance.yml) checks the SDKs against fake_wbskt.py; this checks that what the fake does
# is still what the gateway does. Nothing here gates a merge or an image.

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-conformance
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 40
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Welcome1234
          # The edition production runs, so a feature Express lacks fails here, not on the VM.
          MSSQL_PID: Express
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Welcome1234 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 20s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Redis: localhost:6379
      HOST_SQL_PASSWORD: Wb1-e2e-Host-Login
      ConnectionStrings__AuthDBConnection: Server=localhost;Database=Wbskt.Database.Auth;User ID=wbskt_auth;Password=Wb1-e2e-Host-Login;Encrypt=False;
      ConnectionStrings__DefaultConnection: Server=localhost;Database=Wbskt.Database;User ID=wbskt_management;Password=Wb1-e2e-Host-Login;Encrypt=False;
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Install sqlpackage
        run: |
          dotnet tool list -g | grep -qi '^microsoft\.sqlpackage ' || dotnet tool install -g microsoft.sqlpackage
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Deploy databases
        run: pwsh ./Deploy-Databases.ps1 -HostLoginPassword "$HOST_SQL_PASSWORD"

      - name: Trust the development certificate
        run: |
          dotnet dev-certs https
          dotnet dev-certs https --export-path "$RUNNER_TEMP/aspnet-dev.crt" --format PEM
          sudo cp "$RUNNER_TEMP/aspnet-dev.crt" /usr/local/share/ca-certificates/aspnet-dev.crt
          sudo update-ca-certificates

      - name: Start hosts
        run: Tests/Wbskt.E2E.FeatureTests/start-hosts.sh

      - name: Workspace and policy
        run: |
          set -euo pipefail
          auth=https://localhost:7000
          management=https://localhost:7010
          token=$(curl -fsS -X POST "$auth/api/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"admin@wbskt.com","password":"Password123!"}' | jq -r .accessToken)
          workspace=$(curl -fsS -X POST "$auth/api/v1/workspaces" -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -d "{\"name\":\"nightly-conformance-$GITHUB_RUN_ID\"}" | jq -r .refId)
          pin=$(curl -fsS -X POST "$management/api/v1/workspaces/$workspace/registration-policies" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"nightly-conformance","maxClients":null,"autoApproval":true}' | jq -r .pin)
          if [[ -z "$pin" || "$pin" == "null" ]]; then
            echo "::error::could not create a registration policy"
            exit 1
          fi
          echo "::add-mask::$token"
          {
            echo "WBSKT_LIVE_API_URL=$management"
            echo "WBSKT_LIVE_SOCKET_URL=ws://localhost:5020"
            echo "WBSKT_LIVE_TOKEN=$token"
            echo "WBSKT_LIVE_WORKSPACE=$workspace"
            echo "WBSKT_LIVE_PIN=$pin"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: wbskt/Wbskt.DotNet
          path: wbskt-dotnet

      - name: Live scenarios with the .NET harness
        working-directory: Tests/Conformance
        run: |
          set -o pipefail
          pip install -r requirements.txt
          dotnet build "$GITHUB_WORKSPACE/wbskt-dotnet/conformance/Wbskt.Conformance.Harness" -c Release -o "$RUNNER_TEMP/harness" --nologo -v q
          WBSKT_HARNESS="dotnet $RUNNER_TEMP/harness/Wbskt.Conformance.Harness.dll" \
            python -m pytest -v test_live.py 2>&1 | tee "$GITHUB_WORKSPACE/live-output.txt"

      # Every scenario is skipped when WBSKT_LIVE_* is missing, and a skipped run exits 0.
      - name: Fail if the live scenarios did not run
        run: |
          if ! grep -qE '[0-9]+ passed' live-output.txt || grep -qE ' skipped' live-output.txt; then
            echo "::error::the live conformance scenarios were skipped or did not pass"
            exit 1
          fi

      - name: Host logs
        if: failure()
        run: |
          for f in e2e-hosts/*.log; do
            echo "::group::$f"
            tail -n 300 "$f"
            echo "::endgroup::"
          done

      - name: Upload host logs and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-conformance
          path: |
            e2e-hosts/*.log
            live-output.txt
          if-no-files-found: ignore

      - name: Report the failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/report-nightly-failure.sh "Nightly conformance"
