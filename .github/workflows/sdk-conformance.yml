name: SDK conformance

# Runs the client protocol checklist (Tests/Conformance) against the .NET SDK from wbskt/Wbskt.DotNet
# and the Python SDK from wbskt/Wbskt.Python, so a change to the suite is checked against both.
# The suite fakes the API and socket hosts, so no database, broker or Wbskt host is started.

on:
  pull_request:
    paths:
      - 'Clients/Wbskt.Protocol/**'
      - 'Tests/Conformance/**'
      - 'Docs/Client.Protocol.md'
      - 'Docs/Client.Protocol.WebSocket.md'
      - '.github/workflows/sdk-conformance.yml'
  push:
    branches: [master]
    paths:
      - 'Clients/Wbskt.Protocol/**'
      - 'Tests/Conformance/**'
      - '.github/workflows/sdk-conformance.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: Tests/Conformance

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: [python, dotnet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt

      # A protocol change merges here first, so its SDK half can't be on the SDK's master yet. A
      # branch of the same name there is used instead, when one exists.
      - name: Pick the SDK branch
        id: sdk-ref
        env:
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ matrix.sdk == 'python' && 'wbskt/Wbskt.Python' || 'wbskt/Wbskt.DotNet' }}
        run: |
          ref=master
          if [[ -n "$BRANCH" ]] && git ls-remote --exit-code --heads "https://github.com/$REPO.git" "$BRANCH" > /dev/null; then
            ref="$BRANCH"
          fi
          echo "Using $REPO@$ref"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.sdk-ref.outputs.repo }}
          ref: ${{ steps.sdk-ref.outputs.ref }}
          path: sdk

      - name: Python harness
        if: matrix.sdk == 'python'
        run: |
          pip install -e "$GITHUB_WORKSPACE/sdk"
          echo "WBSKT_HARNESS=python $GITHUB_WORKSPACE/sdk/conformance/harness.py" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        if: matrix.sdk == 'dotnet'
        with:
          global-json-file: sdk/global.json
      - name: .NET harness
        if: matrix.sdk == 'dotnet'
        run: |
          dotnet build "$GITHUB_WORKSPACE/sdk/conformance/Wbskt.Conformance.Harness" -c Release -o "$RUNNER_TEMP/harness" --nologo -v q
          echo "WBSKT_HARNESS=dotnet $RUNNER_TEMP/harness/Wbskt.Conformance.Harness.dll" >> "$GITHUB_ENV"

      - run: python -m pytest -v
