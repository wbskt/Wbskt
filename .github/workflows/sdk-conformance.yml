name: SDK conformance

# Runs the client protocol checklist (Tests/Conformance) against the .NET SDK from wbskt/Wbskt.DotNet,
# the Python SDK from wbskt/Wbskt.Python and the Arduino library from wbskt/Wbskt.Arduino (built for
# Linux over its shims), so a change to the suite or the protocol docs is checked against all three.
# The suite fakes the API and socket hosts, so no database, broker or Wbskt host is started.

on:
  pull_request:
    paths:
      - 'Clients/Wbskt.Protocol/**'
      - 'Tests/Conformance/**'
      - 'Docs/Client.Protocol.md'
      - 'Docs/Client.Protocol.WebSocket.md'
      - 'Docs/Client.Protocol.MQTT.md'
      - '.github/workflows/sdk-conformance.yml'
  push:
    branches: [master]
    paths:
      - 'Clients/Wbskt.Protocol/**'
      - 'Tests/Conformance/**'
      - 'Docs/Client.Protocol.md'
      - 'Docs/Client.Protocol.WebSocket.md'
      - 'Docs/Client.Protocol.MQTT.md'
      - '.github/workflows/sdk-conformance.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: Tests/Conformance

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: [python, dotnet, arduino]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt

      # A protocol change merges here first, so its SDK half can't be on the SDK's master yet. A
      # branch of the same name there is used instead, when one exists.
      - name: Pick the SDK branch
        id: sdk-ref
        env:
          BRANCH: ${{ github.head_ref }}
          SDK: ${{ matrix.sdk }}
        run: |
          case "$SDK" in
            python) REPO=wbskt/Wbskt.Python ;;
            dotnet) REPO=wbskt/Wbskt.DotNet ;;
            arduino) REPO=wbskt/Wbskt.Arduino ;;
            *) echo "::error::no repository for SDK '$SDK'" && exit 1 ;;
          esac
          ref=master
          if [[ -n "$BRANCH" ]] && git ls-remote --exit-code --heads "https://github.com/$REPO.git" "$BRANCH" > /dev/null; then
            ref="$BRANCH"
          fi
          echo "Using $REPO@$ref"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.sdk-ref.outputs.repo }}
          ref: ${{ steps.sdk-ref.outputs.ref }}
          path: sdk

      - name: Python harness
        if: matrix.sdk == 'python'
        run: |
          pip install -e "$GITHUB_WORKSPACE/sdk"
          echo "WBSKT_HARNESS=python $GITHUB_WORKSPACE/sdk/conformance/harness.py" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: matrix.sdk == 'dotnet'
        with:
          global-json-file: sdk/global.json
      - name: .NET harness
        if: matrix.sdk == 'dotnet'
        run: |
          dotnet build "$GITHUB_WORKSPACE/sdk/conformance/Wbskt.Conformance.Harness" -c Release -o "$RUNNER_TEMP/harness" --nologo -v q
          echo "WBSKT_HARNESS=dotnet $RUNNER_TEMP/harness/Wbskt.Conformance.Harness.dll" >> "$GITHUB_ENV"

      # The library's own sources compiled for Linux, as its ci.yml builds them. Its ESP32 scenarios
      # (test_esp32.py) run beside the shared suite, since they need this harness's fixtures.
      - name: Arduino harness
        if: matrix.sdk == 'arduino'
        run: |
          git clone --depth 1 --branch v7.4.2 https://github.com/bblanchon/ArduinoJson "$GITHUB_WORKSPACE/sdk/test/host/ArduinoJson"
          make -C "$GITHUB_WORKSPACE/sdk/test/conformance"
          cp "$GITHUB_WORKSPACE/sdk/test/conformance/test_esp32.py" .
          echo "WBSKT_HARNESS=$GITHUB_WORKSPACE/sdk/test/conformance/wbskt-harness" >> "$GITHUB_ENV"

      - run: python -m pytest -v
