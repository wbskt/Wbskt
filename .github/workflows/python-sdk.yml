name: Python SDK

# Tests the Python device SDK (Clients/python) on the oldest and newest supported Python, and on
# a tag py-v<version> builds it and publishes it to PyPI as `wbskt` through trusted publishing:
# the PyPI project must trust this repository, this workflow and the `pypi` environment. No token.

on:
  pull_request:
    paths: ['Clients/python/**', 'Docs/Device.Protocol.md', '.github/workflows/python-sdk.yml']
  push:
    branches: [master]
    paths: ['Clients/python/**', '.github/workflows/python-sdk.yml']
    tags: ['py-v*']

permissions:
  contents: read

defaults:
  run:
    working-directory: Clients/python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.9'
            websockets: 'websockets==13.0'
          - python: '3.13'
            websockets: 'websockets'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]' '${{ matrix.websockets }}'
      - run: python -m pytest -q

  publish:
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the tag matches the package version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/wbskt/version.py)"
          if [[ "py-v$version" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version $version"
            exit 1
          fi
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: Clients/python/dist
