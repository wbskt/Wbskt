name: Product docs

# A change to how the product behaves is documented on wbskt.com in the same breath. The check itself is
# product-docs-check.yml, which wbskt/Wbskt.Console calls too.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-docs:
    uses: ./.github/workflows/product-docs-check.yml
    with:
      behaviour-paths: '^(Hosts/|Wbskt\.Workflow[^/]*/|Wbskt\.Gateway\.Core/|Wbskt\.Infrastructure/|Wbskt\.Primitives/|Clients/Wbskt\.Protocol/|Clients/Wbskt\.Api\.Client/|Models/|Events/|Databases/|Config/)'
