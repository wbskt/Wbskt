# Probes the production endpoints from outside the VM, every 10 minutes. Prometheus and Alertmanager
# run on the VM they watch, so an outage of the whole machine (stopped, offline, out of disk) sends
# nothing; this, and the Watchdog alert's dead man's switch, are what notice it.
#
# Set the repository variable PROBE_DOMAIN to the stack's DOMAIN (example.com, not a URL) to turn it
# on; without it the run does nothing. A failed probe opens the issue "Outside probe failing", which
# notifies the repository's watchers; the next good probe closes it. GitHub can start a scheduled run
# several minutes late, so expect to hear in 10 to 30 minutes, not at once.
name: Outside probe

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: outside-probe
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ vars.PROBE_DOMAIN != '' }}
    runs-on: ubuntu-latest
    # Well above the slowest probe: a host that drops packets costs each URL about 2 minutes of
    # connect timeouts and retries, and the URLs are probed side by side.
    timeout-minutes: 10
    outputs:
      failed: ${{ steps.probe.outputs.failed }}
    steps:
      - name: Probe the public endpoints
        id: probe
        env:
          DOMAIN: ${{ vars.PROBE_DOMAIN }}
        run: |
          set -uo pipefail
          # Readiness, so a host that is up but cannot reach SQL or the broker counts as down. Five
          # tries over about a minute, any error included (--fail makes Traefik's 404 for a host with
          # no healthy replica one), so a deploy's restart of a single replica is ridden out.
          urls=(
            "https://auth.$DOMAIN/healthz/ready"
            "https://api.$DOMAIN/healthz/ready"
            "https://ws.$DOMAIN/healthz/ready"
            "https://console.$DOMAIN/"
          )
          dir=$(mktemp -d)
          for i in "${!urls[@]}"; do
            curl -sS --fail -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 15 \
              --retry 4 --retry-delay 15 --retry-all-errors "${urls[$i]}" > "$dir/$i" 2>/dev/null &
          done
          wait
          failed=()
          for i in "${!urls[@]}"; do
            code=$(cat "$dir/$i")
            if [[ "$code" == 2* ]]; then
              echo "ok    $code ${urls[$i]}"
            else
              echo "::error::${urls[$i]} answered ${code:-nothing}"
              failed+=("${urls[$i]} (${code:-no answer})")
            fi
          done
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
          [[ ${#failed[@]} -eq 0 ]]

  report:
    needs: probe
    # A run cancelled or skipped says nothing about the stack, so only a finished probe is reported.
    if: ${{ always() && (needs.probe.result == 'success' || needs.probe.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Open or close the outage issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ needs.probe.outputs.failed }}
        run: .github/scripts/report-outside-probe.sh "${{ needs.probe.result }}"
