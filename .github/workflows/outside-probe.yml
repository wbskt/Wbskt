# Probes the production endpoints from outside the VM, every 10 minutes. Prometheus and Alertmanager
# run on the VM they watch, so an outage of the whole machine (stopped, offline, out of disk) sends
# nothing; this, and the Watchdog alert's dead man's switch, are what notice it.
#
# Set the repository variable PROBE_DOMAIN to the stack's DOMAIN (example.com, not a URL). On
# wbskt/Wbskt a run without it fails, and so opens the issue, rather than skipping: it went unset for
# a week of skipped runs that looked like nothing was wrong. Forks skip it. A failed probe opens the
# issue "Outside probe failing", which notifies the repository's watchers; the next good probe closes
# it. GitHub runs a '*/10' schedule only a few times a day on this repository, so this is a backup:
# the uptime monitor and dead man's switch in deploy/README.md ("Alerts from outside") are what notice
# a dead VM in minutes.
name: Outside probe

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: outside-probe
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ vars.PROBE_DOMAIN != '' || github.repository == 'wbskt/Wbskt' }}
    runs-on: ubuntu-latest
    # Well above the slowest probe: a host that drops packets costs each URL about 5 minutes of
    # connect timeouts and retries, and the URLs are probed side by side.
    timeout-minutes: 10
    outputs:
      failed: ${{ steps.probe.outputs.failed }}
    steps:
      - name: Probe the public endpoints
        id: probe
        env:
          DOMAIN: ${{ vars.PROBE_DOMAIN }}
        run: |
          set -uo pipefail
          if [[ -z "$DOMAIN" ]]; then
            echo "::error::the repository variable PROBE_DOMAIN is not set, so nothing outside the VM is probing it"
            echo "failed=nothing: the repository variable PROBE_DOMAIN is not set" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # Readiness, so a host that is up but cannot reach SQL or the broker counts as down. Nine
          # tries over about three minutes, any error included (--fail makes Traefik's 404 for a host
          # with no healthy replica one), so a deploy's restart of a single replica (30s stop grace,
          # then start period and health check, up to about 90s) is ridden out.
          urls=(
            "https://auth.$DOMAIN/healthz/ready"
            "https://api.$DOMAIN/healthz/ready"
            "https://ws.$DOMAIN/healthz/ready"
            "https://console.$DOMAIN/"
          )
          dir=$(mktemp -d)
          for i in "${!urls[@]}"; do
            curl -sS --fail -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 15 \
              --retry 8 --retry-delay 20 --retry-all-errors "${urls[$i]}" > "$dir/$i" 2>/dev/null &
          done
          # MQTT is not HTTP: a TLS handshake with the broker's own name is what a device does first.
          mqtt="mqtt.$DOMAIN:8883"
          (
            for attempt in 1 2 3 4 5 6 7 8 9; do
              if timeout 15 openssl s_client -connect "$mqtt" -servername "mqtt.$DOMAIN" -verify_return_error </dev/null >/dev/null 2>&1; then
                echo ok > "$dir/mqtt"
                exit 0
              fi
              [[ "$attempt" -lt 9 ]] && sleep 20
            done
            echo failed > "$dir/mqtt"
          ) &
          wait
          failed=()
          if [[ "$(cat "$dir/mqtt")" == ok ]]; then
            echo "ok    tls mqtts://$mqtt"
          else
            echo "::error::mqtts://$mqtt did not complete a TLS handshake"
            failed+=("mqtts://$mqtt (no TLS handshake)")
          fi
          for i in "${!urls[@]}"; do
            code=$(cat "$dir/$i")
            if [[ "$code" == 2* ]]; then
              echo "ok    $code ${urls[$i]}"
            else
              echo "::error::${urls[$i]} answered ${code:-nothing}"
              failed+=("${urls[$i]} (${code:-no answer})")
            fi
          done
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
          [[ ${#failed[@]} -eq 0 ]]

  report:
    needs: probe
    # A run cancelled or skipped says nothing about the stack, so only a finished probe is reported.
    if: ${{ always() && (needs.probe.result == 'success' || needs.probe.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Open or close the outage issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ needs.probe.outputs.failed }}
        run: .github/scripts/report-outside-probe.sh "${{ needs.probe.result }}"
