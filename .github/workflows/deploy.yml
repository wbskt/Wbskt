name: Deploy

# Push-based deploy: SSHes into the VM and runs deploy/scripts/deploy.sh there. Nothing inbound
# listens on the VM, so there is no always-on control plane to defend - the SSH key is the only
# credential, and it should be locked to a forced command (see deploy/README.md).
#
# "Build images" calls this automatically after every master push, with that run's sha-<short> tag,
# once the tests and E2E have passed and all five images are published. Dispatch it by hand to
# redeploy or roll back to an older tag.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      services:
        type: string
        required: false
        default: ""
      skip_migrations:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy, e.g. sha-abc1234 (see the Build images run)
        required: true
      services:
        description: Space-separated services to update; blank deploys every host
        required: false
        default: ""
      skip_migrations:
        description: "SKIP the database migrator (leave unchecked: migrations run by default)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Never let two deploys interleave on the same box; queue instead of cancelling, since cancelling
    # mid-deploy would leave a half-updated stack. Set on the job rather than the workflow so the
    # automatic deploys from "Build images" and manual dispatches share the one queue.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Gate on a GitHub Environment so production deploys can require a reviewer's approval.
    environment: production
    permissions:
      contents: read
      # The last step opens an issue when a deploy fails, so a failure is not left to be noticed.
      issues: write
    steps:
      # Inputs and secrets are passed through env, never interpolated into the script body - a
      # ${{ }} expansion inside `run:` is substituted as raw text and would let a crafted input
      # string execute arbitrary commands on the runner.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        # Written to the job's temp directory rather than ~/.ssh: on a self-hosted runner the home
        # directory outlives the job, and its known_hosts may belong to the machine's owner.
        run: |
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/id_deploy" "$RUNNER_TEMP/known_hosts"

      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
        run: |
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::invalid tag '$TAG'" && exit 1
          fi
          # Hyphens for gateway-ws and gateway-mqtt.
          if [[ -n "$SERVICES" && ! "$SERVICES" =~ ^[a-z][a-z\ -]*$ ]]; then
            echo "::error::invalid services '$SERVICES'" && exit 1
          fi

      # Retries only the connection, never deploy.sh: the key is locked to a forced command, so any
      # ssh that gets in starts a deploy. A TCP probe of port 22 tells a VM that is briefly unreachable
      # from one that is down without running anything on it.
      - name: Wait for SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for attempt in 1 2 3; do
            if timeout 20 bash -c 'exec 3<>"/dev/tcp/$DEPLOY_HOST/22"'; then
              exit 0
            fi
            echo "port 22 did not answer (attempt $attempt of 3)"
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::the VM did not answer on port 22 after 3 attempts"
          exit 1

      - name: Deploy
        env:
          TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
          SKIP_MIGRATIONS: ${{ inputs.skip_migrations }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          args=(--tag "$TAG")
          if [[ -n "$SERVICES" ]]; then
            # Comma-joined: ssh flattens the command into one string the VM word-splits, so a
            # space-separated list would arrive as one service per argument.
            args+=(--services "${SERVICES// /,}")
          fi
          if [[ "$SKIP_MIGRATIONS" == "true" ]]; then
            args+=(--skip-migrations)
          fi
          echo "deploy.sh ${args[*]}"
          ssh -i "$RUNNER_TEMP/id_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$DEPLOY_PATH/deploy/scripts/deploy.sh" "${args[@]}"

      # One open issue per run of failures: later failures comment on it instead of opening more.
      - name: Open an issue for the failed deploy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Production deploy failed"
          body="The deploy of \`$TAG\` failed: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
