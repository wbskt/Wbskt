name: Deploy

# Push-based deploy: SSHes into the VM and runs deploy/scripts/deploy.sh there. Nothing inbound
# listens on the VM, so there is no always-on control plane to defend - the SSH key is the only
# credential, and it should be locked to a forced command (see deploy/README.md).
#
# "Build images" calls this automatically after every master push, with that run's sha-<short> tag,
# once the tests and E2E have passed and all five images are published. Dispatch it by hand to
# redeploy or roll back to an older tag.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      services:
        type: string
        required: false
        default: ""
      skip_migrations:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy, e.g. sha-abc1234 (see the Build images run)
        required: true
      services:
        description: Space-separated services to update; blank deploys every host
        required: false
        default: ""
      skip_migrations:
        description: "SKIP the database migrator (leave unchecked: migrations run by default)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Never let two deploys interleave on the same box; queue instead of cancelling, since cancelling
    # mid-deploy would leave a half-updated stack. Set on the job rather than the workflow so the
    # automatic deploys from "Build images" and manual dispatches share the one queue.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Gate on a GitHub Environment so production deploys can require a reviewer's approval.
    environment: production
    # A deploy takes a few minutes. Without a bound, an ssh session to a VM that stopped answering
    # mid-deploy hangs for GitHub's default of 6 hours, holding the deploy queue the whole time.
    timeout-minutes: 30
    permissions:
      contents: read
      # The last step opens an issue when a deploy fails, so a failure is not left to be noticed.
      issues: write
      # Moves :latest to the images a successful deploy put in place.
      packages: write
    steps:
      # Only for the issue scripts; the deploy itself runs from the VM's own checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Inputs and secrets are passed through env, never interpolated into the script body - a
      # ${{ }} expansion inside `run:` is substituted as raw text and would let a crafted input
      # string execute arbitrary commands on the runner.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        # Written to the job's temp directory rather than ~/.ssh: on a self-hosted runner the home
        # directory outlives the job, and its known_hosts may belong to the machine's owner.
        run: |
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/id_deploy" "$RUNNER_TEMP/known_hosts"

      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
        run: |
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::invalid tag '$TAG'" && exit 1
          fi
          # Hyphens for gateway-ws and gateway-mqtt.
          if [[ -n "$SERVICES" && ! "$SERVICES" =~ ^[a-z][a-z\ -]*$ ]]; then
            echo "::error::invalid services '$SERVICES'" && exit 1
          fi

      # Retries only the connection, never deploy.sh: the key is locked to a forced command, so any
      # ssh that gets in starts a deploy. A TCP probe of port 22 tells a VM that is briefly unreachable
      # from one that is down without running anything on it.
      - name: Wait for SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for attempt in 1 2 3; do
            if timeout 20 bash -c 'exec 3<>"/dev/tcp/$DEPLOY_HOST/22"'; then
              exit 0
            fi
            echo "port 22 did not answer (attempt $attempt of 3)"
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::the VM did not answer on port 22 after 3 attempts"
          exit 1

      - name: Deploy
        # bash, not the default `bash -e`: with pipefail the tee below cannot hide a failed deploy.
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
          SKIP_MIGRATIONS: ${{ inputs.skip_migrations }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          args=(--tag "$TAG")
          if [[ -n "$SERVICES" ]]; then
            # Comma-joined: ssh flattens the command into one string the VM word-splits, so a
            # space-separated list would arrive as one service per argument.
            args+=(--services "${SERVICES// /,}")
          fi
          if [[ "$SKIP_MIGRATIONS" == "true" ]]; then
            args+=(--skip-migrations)
          fi
          echo "deploy.sh ${args[*]}"
          # The keepalives end the session within a minute of the VM going silent, rather than
          # leaving it to the job's timeout.
          ssh -i "$RUNNER_TEMP/id_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$DEPLOY_PATH/deploy/scripts/deploy.sh" "${args[@]}" | tee "$RUNNER_TEMP/deploy.log"

      # :latest means what production runs: the migrator the upgrade rehearsal starts from, and what a
      # compose file with no IMAGE_TAG pulls. So it moves here, once deploy.sh has succeeded, for a
      # deploy from master only, and only for the images that deploy put in place (client-auth runs
      # the management image; the migrator only when migrations ran). A failure to move it is reported
      # but does not fail a deploy that happened: the rehearsal then starts from an older migrator.
      - name: Move :latest to what production now runs
        if: success() && github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
          SKIP_MIGRATIONS: ${{ inputs.skip_migrations }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/wbskt"
          images=()
          for service in ${SERVICES:-auth management gateway-ws gateway-mqtt engine}; do
            [[ "$service" == client-auth ]] && service=management
            [[ " ${images[*]} " == *" $service "* ]] || images+=("$service")
          done
          [[ "$SKIP_MIGRATIONS" == "true" ]] || images+=(migrator)
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for image in "${images[@]}"; do
            echo "$prefix-$image:latest -> $TAG"
            if ! docker buildx imagetools create --tag "$prefix-$image:latest" "$prefix-$image:$TAG"; then
              echo "::error::could not move $prefix-$image:latest to $TAG"
              exit 1
            fi
          done

      # deploy.sh brings the supporting services in line itself, but recreating sql, rabbitmq, redis
      # or traefik drops connections, so it only names them. Keep an issue open while any is behind.
      - name: Report services left behind the compose file
        # A GitHub hiccup here must not read as a failed deploy in the step below.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          held=$(sed -n 's/^held-services-behind: *//p' "$RUNNER_TEMP/deploy.log" | tail -1)
          title="Production services behind the compose file"
          if [[ -n "$held" ]]; then
            .github/scripts/sync-labelled-issue.sh open deploy-drift "$title" \
              "After the deploy of \`$TAG\`, these services still run an older definition or config file: $held. Recreating them drops their connections, so it is left for a quiet minute, in deploy/compose on the VM: \`docker compose up -d --no-build --no-deps --force-recreate $held\`. $RUN_URL"
          else
            .github/scripts/sync-labelled-issue.sh close deploy-drift "$title" \
              "Every service matched the compose file after the deploy of \`$TAG\`: $RUN_URL"
          fi

      # One issue for a run of failures: each later failure comments on it, and the next deploy that
      # succeeds closes it. always() rather than failure(): the job timeout cancels rather than fails.
      - name: Report the deploy result
        if: always()
        # Closing the issue after a good deploy must not turn that deploy red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Production deploy failed"
          if [[ "$RESULT" == success ]]; then
            .github/scripts/sync-labelled-issue.sh close deploy-failed "$title" \
              "The deploy of \`$TAG\` succeeded: $RUN_URL"
          else
            COMMENT_IF_OPEN=true .github/scripts/sync-labelled-issue.sh open deploy-failed "$title" \
              "The deploy of \`$TAG\` ended in $RESULT: $RUN_URL"
          fi
