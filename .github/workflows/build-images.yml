name: Build images

# Builds the 4 host images + the migrator and pushes them to GHCR. The VM never builds anything;
# deploy/scripts/deploy.sh only pulls what this workflow published. Pull requests run only the
# tests, the package scan and the upgrade rehearsal: the image jobs are skipped there, so a broken
# Dockerfile first shows up on the master push that would publish it. On master, no image is built
# or pushed until the tests, the scan, E2E and the upgrade rehearsal have passed, so a red E2E never
# moves :latest; once every image has
# succeeded, the deploy job hands that run's sha-<short> tag to deploy.yml. A pull request that
# changes only docs or the Python SDK skips every job after `changes`.
#
# Every job stays on GitHub-hosted runners. The repository is public, and a self-hosted runner would
# run code from any fork's pull request on the machine that hosts it.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Whether this change can affect what the jobs below test. A pull request that touches only the
  # docs, Markdown outside Clients/ (the .NET SDK packs its README) or the Python SDK (which has
  # python-sdk.yml and sdk-conformance.yml) skips them. A skipped job counts as passed for a required
  # check, where a workflow left out by `on: paths-ignore` would never report at all. Pushes and
  # manual runs always run everything, so nothing is published from a partial check.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      hosts: ${{ steps.filter.outputs.hosts }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "hosts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt
          count=$(grep -c . files.txt || true)
          # The API lists at most 3000 files; past that, assume anything changed.
          if [[ "$count" -eq 0 || "$count" -ge 3000 ]]; then
            echo "hosts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relevant=$(awk '!/^Docs\// && !/^Clients\/python\// && !(/\.md$/ && !/^Clients\//)' files.txt)
          echo "changed: $count file(s); affecting the hosts:"
          echo "${relevant:-  none}"
          if [[ -n "$relevant" ]]; then
            echo "hosts=true" >> "$GITHUB_OUTPUT"
          else
            echo "hosts=false" >> "$GITHUB_OUTPUT"
          fi

  # Nothing below publishes an image until these pass. The gate lives in this workflow rather than a
  # separate one so that `needs:` can enforce it directly — a `workflow_run` chain would let a red
  # commit publish first and report second.
  test:
    needs: changes
    if: needs.changes.outputs.hosts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # The project is named explicitly rather than running the solution: Tests/Wbskt.LoadTester is
      # an Exe, not a test project, and `dotnet test` on the solution would try to run it.
      # The SDK packages also target net8.0, which nothing else here builds; packing them catches an
      # API the older target lacks before a publish does (publish-sdk.yml).
      - name: Pack the device SDK
        run: |
          dotnet pack Clients/Wbskt.Protocol/Wbskt.Protocol.csproj -c Release -o packages --nologo -v q
          dotnet pack Clients/Wbskt.Client.Sdk/Wbskt.Client.Sdk.csproj -c Release -o packages --nologo -v q

      - name: Unit tests
        run: |
          dotnet test Tests/Wbskt.Host.Tests/Wbskt.Host.Tests.csproj \
            --nologo -v q --logger "console;verbosity=normal" \
            --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"

      # Coverage and per-test results, kept whether or not the run above passed.
      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: '**/coverage.cobertura.xml'
          targetdir: coverage-report
          reporttypes: 'HtmlInline;MarkdownSummaryGithub'

      - name: Coverage summary
        if: always()
        run: |
          if [[ -f coverage-report/SummaryGithub.md ]]; then
            cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-results
          path: |
            TestResults/**/*.trx
            coverage-report/
          if-no-files-found: ignore

  integration:
    needs: changes
    if: needs.changes.outputs.hosts == 'true'
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Welcome1234
          # The edition production runs, so a feature Express lacks fails here, not on the VM.
          MSSQL_PID: Express
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Welcome1234 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

      # A real SMTP relay for the delivery tests. Everything else in the suite stops at "the message
      # was queued", which leaves the whole SMTP boundary unverified until production - and since
      # sign-in requires a confirmed address, mail that does not leave means nobody can sign up.
      # 1025 is SMTP, 8025 is the HTTP API the tests read messages back from.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      WBSKT_INTEGRATION_CONNSTR: Server=localhost,1433;Database=master;User Id=sa;Password=Welcome1234;TrustServerCertificate=True;Connect Timeout=30;
      WBSKT_SMTP_TEST_HOST: localhost
      WBSKT_SMTP_TEST_PORT: "1025"
      WBSKT_SMTP_TEST_API: http://localhost:8025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # `dotnet tool install` fails when the tool is already there, so install only when it is missing.
      - name: Install sqlpackage
        run: |
          dotnet tool list -g | grep -qi '^microsoft\.sqlpackage ' || dotnet tool install -g microsoft.sqlpackage
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Both DACPACs: the suite deploys the workflow database for the engine's provider tests and the
      # auth database for the account-recovery procedures, into separate databases as in production.
      # Built explicitly rather than left to the fixture's on-the-fly fallback, so a broken .sqlproj
      # fails here with a real compiler error instead of surfacing as "DACPAC not found".
      - name: Build DACPACs
        run: |
          dotnet build Databases/Wbskt.Database/Wbskt.Database.sqlproj -c Debug --nologo
          dotnet build Databases/Wbskt.Database.Auth/Wbskt.Database.Auth.sqlproj -c Debug --nologo

      - name: Integration tests
        run: |
          set -o pipefail
          dotnet test Tests/Wbskt.Workflow.Engine.Host.IntegrationTests/Wbskt.Workflow.Engine.Host.IntegrationTests.csproj \
            --nologo -v q --logger "console;verbosity=detailed" \
            --logger trx --results-directory TestResults --collect:"XPlat Code Coverage" 2>&1 | tee test-output.txt

      # Every test here is a [SkippableFact] that skips itself when SQL Edge is unreachable, and a
      # fully-skipped run still exits 0. Without this check CI would report green for a suite that
      # never executed — exactly the failure mode the fixture's own comments warn about.
      - name: Fail if the suite did not actually run
        if: always()
        run: |
          skipped=$(grep -oP 'Skipped:\s*\K\d+' test-output.txt | head -1)
          passed=$(grep -oP 'Passed:\s*\K\d+' test-output.txt | head -1)
          echo "passed=${passed:-0} skipped=${skipped:-0}"
          if [[ "${skipped:-0}" -gt 0 ]]; then
            echo "::error::${skipped} integration tests were skipped; they must run against the SQL service container"
            exit 1
          fi
          if [[ "${passed:-0}" -eq 0 ]]; then
            echo "::error::no integration tests executed"
            exit 1
          fi

      # Coverage and per-test results, kept whether or not the run above passed.
      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: '**/coverage.cobertura.xml'
          targetdir: coverage-report
          reporttypes: 'HtmlInline;MarkdownSummaryGithub'

      - name: Coverage summary
        if: always()
        run: |
          if [[ -f coverage-report/SummaryGithub.md ]]; then
            cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-results
          path: |
            TestResults/**/*.trx
            coverage-report/
          if-no-files-found: ignore

  # The black-box suite in Tests/Wbskt.E2E.FeatureTests, against all five hosts started from source
  # as Development. That environment is what raises the auth host's per-IP rate limit (every test
  # shares the runner's address) and lets freshly registered users sign in without a mailbox.
  #
  # One leg per pass, each on its own runner with its own databases, broker, Redis and hosts, so the
  # passes that used to run one after another to keep out of each other's way (the rate limits spent,
  # the gateway restarted, the broker stopped) now run side by side. The main pass is split three
  # ways by folder. The last shard is "everything the other two do not take", so a new folder always
  # lands in one shard and no test can fall between them. The engine collection runs its classes one
  # after another, so the split follows its folders: Lifecycle, then Triggers with Timeouts, then the
  # rest (auth, devices and the smaller engine folders, which still run as parallel collections).
  e2e:
    needs: changes
    if: needs.changes.outputs.hosts == 'true'
    name: e2e (${{ matrix.pass }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pass: lifecycle
            filter: FullyQualifiedName~.Scenarios.Lifecycle.
          - pass: triggers
            filter: FullyQualifiedName~.Scenarios.Triggers.|FullyQualifiedName~.Scenarios.Timeouts.
          - pass: rest
            filter: FullyQualifiedName!~.Scenarios.Lifecycle.&FullyQualifiedName!~.Scenarios.Triggers.&FullyQualifiedName!~.Scenarios.Timeouts.
          - pass: rate-limit
          - pass: outage
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Welcome1234
          # The edition production runs, so a feature Express lacks fails here, not on the VM.
          MSSQL_PID: Express
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Welcome1234 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 20s
      # Carries access-token revocations from the auth host to management (AUTH_TK_10).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Redis: localhost:6379
      # The hosts connect with the same least-privilege logins as production (see "SQL logins" in
      # deploy/README.md), so a host that starts sending SQL its login may not run fails here.
      HOST_SQL_PASSWORD: Wb1-e2e-Host-Login
      ConnectionStrings__AuthDBConnection: Server=localhost;Database=Wbskt.Database.Auth;User ID=wbskt_auth;Password=Wb1-e2e-Host-Login;Encrypt=False;
      # Management and engine share this one variable here, so both run as wbskt_management.
      # wbskt_engine carries exactly the same grants.
      ConnectionStrings__DefaultConnection: Server=localhost;Database=Wbskt.Database;User ID=wbskt_management;Password=Wb1-e2e-Host-Login;Encrypt=False;
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # `dotnet tool install` fails when the tool is already there, so install only when it is missing.
      - name: Install sqlpackage
        run: |
          dotnet tool list -g | grep -qi '^microsoft\.sqlpackage ' || dotnet tool install -g microsoft.sqlpackage
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Deploy databases
        run: pwsh ./Deploy-Databases.ps1 -HostLoginPassword "$HOST_SQL_PASSWORD"

      # The hosts serve HTTPS on their dev ports with the development certificate, and it has to be
      # trusted system-wide: the client SDK the tests drive validates it, and so does Management when
      # it calls the engine on https://localhost:7030. `dotnet dev-certs https --trust` only half
      # does this on Linux (it exits non-zero), so the certificate goes into the OS store directly.
      - name: Trust the development certificate
        run: |
          dotnet dev-certs https
          dotnet dev-certs https --export-path "$RUNNER_TEMP/aspnet-dev.crt" --format PEM
          sudo cp "$RUNNER_TEMP/aspnet-dev.crt" /usr/local/share/ca-certificates/aspnet-dev.crt
          sudo update-ca-certificates

      - name: Start hosts
        id: hosts
        run: Tests/Wbskt.E2E.FeatureTests/start-hosts.sh

      # Every pass below runs with --no-build, so the suite is built once here.
      - name: Build the E2E suite
        id: build
        run: dotnet build Tests/Wbskt.E2E.FeatureTests/Wbskt.E2E.FeatureTests.csproj --nologo -v q

      # Each host's OpenAPI document (/openapi/v1.json, served in Development) against the snapshot
      # checked in under Tests/Wbskt.E2E.FeatureTests/openapi, so a route or contract change is a
      # reviewed diff. A snapshot not committed yet is written instead of compared, with a warning;
      # the documents fetched are uploaded either way, to be committed from the artifact. The E2E
      # tests still run when this fails, so a contract diff does not hide their result. One leg is
      # enough: every leg runs the same hosts.
      - name: OpenAPI snapshots
        if: matrix.pass == 'rest'
        run: Tests/Wbskt.E2E.FeatureTests/openapi/refresh.sh --check

      - name: Upload OpenAPI documents
        if: ${{ !cancelled() && matrix.pass == 'rest' && steps.hosts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: openapi-snapshots
          path: openapi-current/
          if-no-files-found: warn

      # The main pass, this leg's share of it. The opt-in scenarios in the share skip themselves: the
      # rate-limit, gateway-restart and outage ones each need a variable only their own leg sets.
      - name: E2E tests
        if: ${{ !cancelled() && matrix.filter && steps.hosts.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          E2E_FILTER: ${{ matrix.filter }}
        run: |
          set -o pipefail
          dotnet test Tests/Wbskt.E2E.FeatureTests/Wbskt.E2E.FeatureTests.csproj --no-build \
            --filter "$E2E_FILTER" \
            --nologo -v q --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=e2e.trx" --results-directory TestResults 2>&1 | tee e2e-output.txt

      # The device-revocation scenario that restarts the WebSocket gateway: a revoked device's token
      # must still be refused once the host has forgotten every event it heard. It shares the outage
      # leg because both take things down under the hosts, and neither may run under the main pass.
      - name: Gateway restart tests
        if: ${{ !cancelled() && matrix.pass == 'outage' && steps.hosts.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          E2E_SOCKET_RESTART_COMMAND: ${{ github.workspace }}/Tests/Wbskt.E2E.FeatureTests/start-hosts.sh gateway-ws
        run: |
          set -o pipefail
          dotnet test Tests/Wbskt.E2E.FeatureTests/Wbskt.E2E.FeatureTests.csproj --no-build \
            --filter "FullyQualifiedName~DeviceRevocationTests.DEV_REV_02" \
            --nologo -v q --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=sr.trx" --results-directory TestResults 2>&1 | tee sr-output.txt

      # The rate-limit scenarios. They exhaust the shared per-IP budget on purpose, and the budget
      # outlives a test (AUTH_RL_01 leaves the next one unable to even register its user), so each
      # gets an auth host restarted with the production limit. A restart is a fresh window: the limiter
      # is in memory.
      - name: Rate-limit tests
        if: ${{ !cancelled() && matrix.pass == 'rate-limit' && steps.hosts.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          RateLimiting__Authentication__PermitLimit: "10"
          E2E_AUTH_PERMIT_LIMIT: "10"
          RateLimiting__TokenRefresh__PermitLimit: "120"
          E2E_REFRESH_PERMIT_LIMIT: "120"
          RateLimiting__EmailVerification__PermitLimit: "10"
          E2E_VERIFICATION_PERMIT_LIMIT: "10"
          E2E_RATE_LIMIT_TESTS: "1"
        run: |
          set -o pipefail
          project=Tests/Wbskt.E2E.FeatureTests/Wbskt.E2E.FeatureTests.csproj
          tests=$(dotnet test "$project" --no-build --list-tests | grep -oP 'RateLimitingTests\.\K\w+')
          if [[ -z "$tests" ]]; then
            echo "::error::no RateLimitingTests found"
            exit 1
          fi
          status=0
          for t in $tests; do
            Tests/Wbskt.E2E.FeatureTests/start-hosts.sh auth
            dotnet test "$project" --no-build --filter "FullyQualifiedName~RateLimitingTests.$t" \
              --nologo -v q --logger "console;verbosity=normal" \
              --logger "trx;LogFileName=rl-$t.trx" --results-directory TestResults 2>&1 | tee -a rl-output.txt || status=1
          done
          # The 429 row of the error-shape contract theory, which the main pass skips for the same reason.
          Tests/Wbskt.E2E.FeatureTests/start-hosts.sh auth
          dotnet test "$project" --no-build --filter "FullyQualifiedName~ErrorShapeContractTests&DisplayName~RateLimited429" \
            --nologo -v q --logger "console;verbosity=normal" 2>&1 | tee contract-429.txt || status=1
          cat contract-429.txt >> rl-output.txt
          if ! grep -qP 'Passed:\s*[1-9]' contract-429.txt; then
            echo "::error::the RateLimited429 row of ErrorShapeContractTests did not run"
            status=1
          fi
          exit $status

      # The outage scenarios (Scenarios/Outage), which every other pass skips. outage.sh stops the
      # RabbitMQ and Redis service containers by id and kills whichever engine holds the lease. Each
      # scenario brings back what it took down as it ends, and restore-all runs once more here
      # whatever happened. The runner's user can drive the service containers: the docker socket is
      # open to it.
      - name: Outage tests
        if: ${{ !cancelled() && matrix.pass == 'outage' && steps.hosts.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          E2E_OUTAGE_COMMAND: "${{ github.workspace }}/Tests/Wbskt.E2E.FeatureTests/outage.sh {action}"
          E2E_RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
          E2E_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          set -o pipefail
          status=0
          dotnet test Tests/Wbskt.E2E.FeatureTests/Wbskt.E2E.FeatureTests.csproj --no-build \
            --filter "FullyQualifiedName~Scenarios.Outage" \
            --nologo -v q --logger "console;verbosity=normal" 2>&1 | tee outage-output.txt || status=1
          Tests/Wbskt.E2E.FeatureTests/outage.sh restore-all || status=1
          exit $status

      # Every test is a [SkippableFact] that skips itself when the hosts are unreachable, and a
      # fully skipped run exits 0, so a host that never came up would otherwise report green.
      # A handful of scenarios skip by design (an engine-only route, an opt-in gate), so this
      # checks that each pass this leg ran actually ran tests rather than demanding zero skips.
      - name: Fail if the suite did not actually run
        if: always()
        env:
          PASS: ${{ matrix.pass }}
        run: |
          case "$PASS" in
            rate-limit) files="rl-output.txt" ;;
            outage) files="sr-output.txt outage-output.txt" ;;
            *) files="e2e-output.txt" ;;
          esac
          for f in $files; do
            passed=$(grep -oP 'Passed:\s*\K\d+' "$f" 2>/dev/null | awk '{ n += $1 } END { print n + 0 }')
            echo "$f: passed=${passed:-0}"
            if [[ "${passed:-0}" -eq 0 ]]; then
              echo "::error::no tests executed in $f"
              exit 1
            fi
          done

      - name: Host logs
        if: failure()
        run: |
          for f in e2e-hosts/*.log; do
            echo "::group::$f"
            tail -n 300 "$f"
            echo "::endgroup::"
          done

      # Per failing test, the host log lines written while it ran (the window comes from the trx).
      # The tail above is the whole job's last moments; this is what each red test actually saw.
      - name: Host logs per failing test
        if: failure()
        run: python3 Tests/Wbskt.E2E.FeatureTests/host-log-tail.py TestResults e2e-hosts

      - name: Upload host logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.pass }}
          path: |
            e2e-hosts/*.log
            *-output.txt
            TestResults/**/*.trx
          if-no-files-found: ignore

  # The main pass is split across three legs by folder (see the e2e job). The rest leg's filter is
  # the complement of the other two, so the split cannot drop a test; this checks that every leg ran
  # tests and that no test ran in two of them.
  e2e-shards:
    needs: [changes, e2e]
    if: ${{ !cancelled() && needs.changes.outputs.hosts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-*
          path: results

      - name: Every test in exactly one shard
        run: |
          total=0
          for pass in lifecycle triggers rest; do
            f="results/e2e-results-$pass/e2e-output.txt"
            n=$(grep -oP 'Total tests:\s*\K\d+' "$f" 2>/dev/null | head -1 || true)
            echo "$pass: ${n:-missing}"
            if [[ -z "$n" || "$n" -eq 0 ]]; then
              echo "::error::the $pass shard reported no tests"
              exit 1
            fi
            total=$((total + n))
            # Unique within the shard first: a theory's rows can share a name.
            grep -oP '^\s+(Passed|Failed|Skipped) \KWbskt\.E2E\.FeatureTests\.[^\s(]+' "$f" | sort -u >> names.txt || true
          done
          dupes=$(sort names.txt | uniq -d)
          if [[ -n "$dupes" ]]; then
            echo "::error::tests ran in more than one shard:"
            echo "$dupes"
            exit 1
          fi
          echo "the three shards ran $total tests between them, none of them twice"

  scan:
    needs: changes
    if: needs.changes.outputs.hosts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Restore first: `list package --vulnerable` reports nothing useful against an unrestored tree.
      # Parsed as JSON rather than by grepping the human-readable output — only projects that
      # actually have findings carry a "frameworks" key, so this cannot be broken by a wording change.
      - name: Vulnerable packages
        run: |
          dotnet restore Wbskt.slnx
          dotnet list Wbskt.slnx package --vulnerable --include-transitive --format json > vuln.json
          count=$(jq '[.projects[] | select(has("frameworks"))] | length' vuln.json)
          if [[ "$count" -gt 0 ]]; then
            echo "::error::vulnerable NuGet packages found in ${count} project(s)"
            jq -r '.projects[] | select(has("frameworks")) | .path' vuln.json
            exit 1
          fi
          echo "no vulnerable packages"

  # Rehearses the upgrade production is about to get (#367): the migrator image production last ran
  # (:latest, which only moves after a green master build; a deploy that failed or still awaits
  # approval since then makes it newer than production) builds both databases, every table gets a
  # row, and this commit's migrator upgrades them. Fails on possible data loss, on a table that comes
  # out with fewer rows, and on any difference left between the upgraded schema and this commit's
  # DACPACs. See "Upgrade rehearsal" in deploy/README.md. Skipped for pull requests from forks, which
  # get no token to pull the image with.
  migration-rehearsal:
    needs: changes
    if: >-
      needs.changes.outputs.hosts == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Welcome1234
          MSSQL_PID: Express
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Welcome1234 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This commit's migrator, loaded into the local daemon rather than pushed. Writes the migrator
      # job's cache scope, so that job's build on master is mostly a cache hit.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.migrator
          platforms: linux/amd64
          load: true
          push: false
          tags: wbskt-migrator:rehearsal
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

      - name: Rehearse the upgrade
        env:
          OWNER: ${{ github.repository_owner }}
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
          SA_PASSWORD: Welcome1234
          CURRENT_IMAGE: wbskt-migrator:rehearsal
        run: |
          export PREVIOUS_IMAGE="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/wbskt-migrator:latest"
          deploy/rehearsal/rehearse.sh

      - name: Upload rehearsal output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-rehearsal
          path: rehearsal-out/
          if-no-files-found: ignore

  meta:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      prefix: ${{ steps.v.outputs.prefix }}
    steps:
      # GHCR rejects uppercase in image names, and github.repository_owner preserves the case the
      # org was registered with, so normalise rather than assuming it is already lowercase.
      - id: v
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/wbskt" >> "$GITHUB_OUTPUT"

  hosts:
    needs: [meta, test, integration, scan, e2e, e2e-shards, migration-rehearsal]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            project: Hosts/Wbskt.Auth.Host/Wbskt.Auth.Host.csproj
            dll: Wbskt.Auth.Host.dll
          - service: management
            project: Hosts/Wbskt.Management.Host/Wbskt.Management.Host.csproj
            dll: Wbskt.Management.Host.dll
          - service: gateway-ws
            project: Hosts/Wbskt.Gateway.WebSocket.Host/Wbskt.Gateway.WebSocket.Host.csproj
            dll: Wbskt.Gateway.WebSocket.Host.dll
          - service: engine
            project: Hosts/Wbskt.Workflow.Engine.Host/Wbskt.Workflow.Engine.Host.csproj
            dll: Wbskt.Workflow.Engine.Host.dll
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          # The production VM is x64, and the self-hosted runner may not be: an unpinned build
          # would publish the runner's architecture.
          platforms: linux/amd64
          build-args: |
            HOST_PROJECT=${{ matrix.project }}
            HOST_DLL=${{ matrix.dll }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ needs.meta.outputs.prefix }}-${{ matrix.service }}:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.prefix }}-${{ matrix.service }}:latest
          # Scoped per service so the four parallel jobs don't evict each other's cache.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  migrator:
    needs: [meta, test, integration, scan, e2e, e2e-shards, migration-rehearsal]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.migrator
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ needs.meta.outputs.prefix }}-migrator:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.prefix }}-migrator:latest
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  # Every master push that gets this far lands on the VM. E2E already gates the image builds above;
  # it stays listed here so the deploy cannot outrun it if that changes.
  deploy:
    needs: [meta, hosts, migrator, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.meta.outputs.tag }}
    secrets: inherit
