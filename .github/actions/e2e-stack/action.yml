name: E2E stack
description: >-
  Deploys both databases, trusts the development certificate and starts every host from source, as
  Tests/Wbskt.E2E.FeatureTests/start-hosts.sh does. Shared by the E2E job in build-images.yml and the
  nightly stress and conformance runs, so their setup cannot drift apart.

# A composite action cannot declare service containers, so each job still declares SQL Server,
# RabbitMQ and Redis on their usual ports, and sets HOST_SQL_PASSWORD, ConnectionStrings__Redis,
# __AuthDBConnection and __DefaultConnection. Anything else the hosts should see (a raised rate limit,
# an internal key) goes in the job's env: start-hosts.sh passes the environment through to them.
# The repository must be checked out first.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: Directory.Packages.props

    # `dotnet tool install` fails when the tool is already there, so install only when it is missing.
    - name: Install sqlpackage
      shell: bash
      run: |
        dotnet tool list -g | grep -qi '^microsoft\.sqlpackage ' || dotnet tool install -g microsoft.sqlpackage
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Deploy databases
      shell: bash
      run: pwsh ./Deploy-Databases.ps1 -HostLoginPassword "${HOST_SQL_PASSWORD:?the job sets HOST_SQL_PASSWORD}"

    # The hosts serve HTTPS on their dev ports with the development certificate, and it has to be
    # trusted system-wide: the client SDKs the tests drive validate it, and so does Management when
    # it calls the engine on https://localhost:7030. `dotnet dev-certs https --trust` only half
    # does this on Linux (it exits non-zero), so the certificate goes into the OS store directly.
    - name: Trust the development certificate
      shell: bash
      run: |
        dotnet dev-certs https
        dotnet dev-certs https --export-path "$RUNNER_TEMP/aspnet-dev.crt" --format PEM
        sudo cp "$RUNNER_TEMP/aspnet-dev.crt" /usr/local/share/ca-certificates/aspnet-dev.crt
        sudo update-ca-certificates

    - name: Start hosts
      shell: bash
      run: Tests/Wbskt.E2E.FeatureTests/start-hosts.sh
