# Weekly update proposals, one grouped PR per ecosystem so a week's bumps are reviewed and tested
# together. Majors are left out of the groups and come as their own PRs, since they are the ones
# that need reading. The package scan in build-images.yml still gates what merges; this only proposes.
version: 2

updates:
  # Directory.Packages.props pins every NuGet version centrally.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      nuget:
        update-types: [minor, patch]

  # The pinned SHAs in .github/workflows, with the version in their trailing comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]

  # The base images of the host and migrator images.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      images:
        update-types: [minor, patch]
