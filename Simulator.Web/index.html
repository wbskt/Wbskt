<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBSKT Client Simulator</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --error: #cf6679;
            --text: #e1e1e1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            padding: 20px;
            gap: 20px;
        }
        .panel {
            background-color: var(--surface);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        h2 { margin-top: 0; color: var(--primary); border-bottom: 1px solid #333; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background-color: var(--primary); color: black; }
        .btn-secondary { background-color: var(--secondary); color: black; }
        .btn-danger { background-color: var(--error); color: white; }
        
        #log, #commands {
            height: 300px;
            overflow-y: auto;
            background: #000;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .log-entry { margin-bottom: 4px; border-left: 3px solid #444; padding-left: 8px; }
        .log-info { border-left-color: var(--secondary); }
        .log-error { border-left-color: var(--error); }
        .log-cmd { border-left-color: var(--primary); }
        .timestamp { color: #888; margin-right: 8px; }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 10px;
        }
        .status-offline { background: #444; color: #aaa; }
        .status-online { background: #1b5e20; color: #4caf50; }
        .status-connecting { background: #e65100; color: #ff9800; }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <h2>WBSKT Simulator 
                <span id="statusBadge" class="status-badge status-offline">OFFLINE</span>
            </h2>
            <div class="grid">
                <div>
                    <div class="form-group">
                        <label>Management API URL</label>
                        <input type="text" id="apiUrl" value="https://localhost:7010">
                    </div>
                    <div class="form-group">
                        <label>Socket Server URL (WSS)</label>
                        <input type="text" id="socketUrl" value="wss://localhost:7020">
                    </div>
                </div>
                <div>
                    <div class="form-group">
                        <label>Device Name (Unique per tab)</label>
                        <input type="text" id="deviceName" placeholder="LivingRoom-Sensor">
                    </div>
                    <div class="form-group">
                        <label>Policy PIN</label>
                        <input type="text" id="policyPin" value="123456">
                    </div>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="connectBtn" class="btn-primary" onclick="startLifecycle()">Register & Connect</button>
                <button id="disconnectBtn" class="btn-danger" onclick="disconnect()" disabled>Disconnect</button>
                <button class="btn-secondary" onclick="clearStorage()">Clear Credentials</button>
            </div>
        </div>

        <div class="grid">
            <div class="panel">
                <h2>Send Telemetry</h2>
                <div class="form-group">
                    <label>Telemetry Sub-Type</label>
                    <input type="text" id="telemetryType" value="environment">
                </div>
                <div class="form-group">
                    <label>JSON Payload</label>
                    <textarea id="telemetryPayload" style="height: 100px;">{ "temperature": 24.5, "humidity": 45 }</textarea>
                </div>
                <button id="sendBtn" class="btn-secondary" onclick="sendTelemetry()" disabled>Send Message</button>
            </div>
            <div class="panel">
                <h2>Received Commands</h2>
                <div id="commands"></div>
            </div>
        </div>

        <div class="panel">
            <h2>System Logs</h2>
            <div id="log"></div>
        </div>
    </div>

    <script>
        let socket = null;
        let clientRefId = null;
        let secret = null;
        let isConnected = false;

        // Auto-generate name if empty
        if (!document.getElementById('deviceName').value) {
            document.getElementById('deviceName').value = 'Sim-' + Math.floor(Math.random() * 10000);
        }

        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="timestamp">[${time}]</span> ${msg}`;
            logDiv.prepend(entry);
        }

        function updateUI(status) {
            const badge = document.getElementById('statusBadge');
            badge.innerText = status.toUpperCase();
            badge.className = `status-badge status-${status.toLowerCase()}`;
            
            isConnected = status === 'online';
            document.getElementById('connectBtn').disabled = isConnected || status === 'connecting';
            document.getElementById('disconnectBtn').disabled = !isConnected;
            document.getElementById('sendBtn').disabled = !isConnected;
        }

        async function startLifecycle() {
            const apiUrl = document.getElementById('apiUrl').value;
            const deviceName = document.getElementById('deviceName').value;
            const pin = document.getElementById('policyPin').value;

            updateUI('connecting');
            log(`Starting lifecycle for ${deviceName}...`);

            try {
                // 1. Check local storage
                const storageKey = `wbskt_creds_${deviceName}`;
                const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
                
                if (saved && saved.clientRefId && saved.secret) {
                    clientRefId = saved.clientRefId;
                    secret = saved.secret;
                    log(`Found saved credentials: ${clientRefId}`);
                } else {
                    log(`No credentials found. Attempting registration with PIN ${pin}...`);
                    const resp = await fetch(`${apiUrl}/api/client-registrations/initiate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: deviceName, pin: pin })
                    });

                    if (!resp.ok) throw new Error(`Registration failed: ${resp.statusText}`);
                    
                    const result = await resp.json();
                    clientRefId = result.clientRefId;
                    secret = result.secret;
                    
                    localStorage.setItem(storageKey, JSON.stringify({ clientRefId, secret }));
                    log(`Registered successfully! New ID: ${clientRefId}`);
                }

                // 2. Login to get JWT
                log(`Logging in...`);
                const loginResp = await fetch(`${apiUrl}/api/client-auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clientRefId, secret })
                });

                if (!loginResp.ok) throw new Error(`Login failed: ${loginResp.statusText}`);
                const { accessToken } = await loginResp.json();
                log(`JWT obtained. Connecting to socket...`);

                // 3. Connect Socket
                connectSocket(accessToken);

            } catch (err) {
                log(`ERROR: ${err.message}`, 'error');
                updateUI('offline');
            }
        }

        function connectSocket(token) {
            const wsUrl = document.getElementById('socketUrl').value;
            
            // Note: The browser's native WebSocket API does not support custom HTTP headers (like Authorization).
            // Therefore, we must continue to pass the token via the query string.
            // The Server's WebSocketAuthMiddleware will handle this fallback gracefully.
            socket = new WebSocket(`${wsUrl}/ws?access_token=${token}`);

            socket.onopen = () => {
                log('Connected to real-time gateway.', 'info');
                updateUI('online');
            };

            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'command') {
                    handleCommand(msg);
                }
            };

            socket.onclose = () => {
                log('Socket connection closed.', 'error');
                updateUI('offline');
            };

            socket.onerror = (err) => {
                log('Socket error occurred.', 'error');
            };
        }

        function handleCommand(msg) {
            const { action, payload } = msg;
            log(`RECEIVED COMMAND: ${action}`, 'cmd');
            
            const cmdList = document.getElementById('commands');
            const entry = document.createElement('div');
            entry.className = 'log-entry log-cmd';
            entry.innerHTML = `<strong>${action}</strong><br><small>${JSON.stringify(payload)}</small>`;
            cmdList.prepend(entry);

            // Automatic Pong for Ping
            if (action === 'ping') {
                const pong = {
                    type: 'pong',
                    payload: { originalTimestamp: payload.timestamp }
                };
                socket.send(JSON.stringify(pong));
                log('Sent auto-pong response.', 'info');
            }
        }

        function sendTelemetry() {
            if (!isConnected) return;
            
            const type = document.getElementById('telemetryType').value;
            const payloadStr = document.getElementById('telemetryPayload').value;
            
            try {
                const data = JSON.parse(payloadStr);
                const msg = {
                    type: 'telemetry',
                    payload: {
                        subType: type,
                        data: data
                    }
                };
                
                socket.send(JSON.stringify(msg));
                log(`Sent telemetry: ${type}`);
            } catch (e) {
                log(`Invalid JSON payload: ${e.message}`, 'error');
            }
        }

        function disconnect() {
            if (socket) socket.close();
            updateUI('offline');
        }

        function clearStorage() {
            const deviceName = document.getElementById('deviceName').value;
            localStorage.removeItem(`wbskt_creds_${deviceName}`);
            log(`Credentials for ${deviceName} cleared.`);
        }
    </script>
</body>
</html>
