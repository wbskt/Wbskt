<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postman-Island Workflow Builder</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f1115;
            color: #94a3b8;
            margin: 0;
            overflow: hidden;
        }

        .jetbrains-mono { font-family: 'JetBrains Mono', monospace; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2d3139; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }

        .canvas-grid {
            background-image: radial-gradient(#1e2128 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .node-island {
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #181a1f;
        }

        .port-dot:hover {
            transform: scale(1.4);
            background-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;
        const { 
            Play, Square, Clock, Send, Mail, MessageSquare, 
            Bell, Globe, Database, Cpu, GitBranch, Repeat, 
            Variable, Trash2, Maximize, ZoomIn, ZoomOut, Copy, Download, X, Settings2, ChevronRight
        } = lucide;

        // --- Configuration ---
        const NODE_TYPES = {
            'trigger:device': { label: 'Device Sensor', icon: 'Cpu', color: '#10b981', category: 'Trigger' },
            'trigger:timer': { label: 'Timer Schedule', icon: 'Clock', color: '#10b981', category: 'Trigger' },
            'action:command': { label: 'Send Command', icon: 'Send', color: '#3b82f6', category: 'Action' },
            'action:webhook': { label: 'Webhook', icon: 'Globe', color: '#3b82f6', category: 'Action' },
            'control:logic': { label: 'Logic Gate', icon: 'GitBranch', color: '#f59e0b', category: 'Control' },
            'control:loop': { label: 'Loop', icon: 'Repeat', color: '#f59e0b', category: 'Control' },
        };

        const IconRenderer = ({ name, size = 16, color = "currentColor" }) => {
            const IconTag = lucide[name] || Globe;
            return <IconTag size={size} color={color} />;
        };

        const App = () => {
            const [nodes, setNodes] = useState([
                { id: '1', type: 'trigger:device', x: 100, y: 150, name: 'Temperature Sensor', props: { deviceId: 'TH-001' } },
                { id: '2', type: 'control:logic', x: 400, y: 150, name: 'Check Threshold', props: { condition: '> 75' } },
                { id: '3', type: 'action:webhook', x: 700, y: 150, name: 'Alert Slack', props: { url: 'https://hooks.slack...' } }
            ]);
            const [edges, setEdges] = useState([
                { id: 'e1', source: '1', target: '2' },
                { id: 'e2', source: '2', target: '3' }
            ]);
            
            const [selectedId, setSelectedId] = useState(null);
            const [transform, setTransform] = useState({ x: 0, y: 0, scale: 1 });
            const [draggingNode, setDraggingNode] = useState(null);
            const [connecting, setConnecting] = useState(null);
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const canvasRef = useRef(null);

            // --- Handlers ---
            const handleCanvasMouseDown = (e) => {
                if (e.target === canvasRef.current) {
                    setSelectedId(null);
                }
            };

            const handleNodeMouseDown = (e, node) => {
                e.stopPropagation();
                setSelectedId(node.id);
                const rect = e.currentTarget.getBoundingClientRect();
                setDraggingNode({
                    id: node.id,
                    offsetX: (e.clientX - rect.left) / transform.scale,
                    offsetY: (e.clientY - rect.top) / transform.scale
                });
            };

            const onMouseMove = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                setMousePos({ x, y });

                if (draggingNode) {
                    setNodes(prev => prev.map(n => n.id === draggingNode.id ? {
                        ...n,
                        x: (x / transform.scale) - draggingNode.offsetX - (transform.x / transform.scale),
                        y: (y / transform.scale) - draggingNode.offsetY - (transform.y / transform.scale)
                    } : n));
                }
            };

            const onMouseUp = () => {
                setDraggingNode(null);
                setConnecting(null);
            };

            const handlePortMouseDown = (e, nodeId, type) => {
                e.stopPropagation();
                if (type === 'out') {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const canvasRect = canvasRef.current.getBoundingClientRect();
                    setConnecting({
                        sourceId: nodeId,
                        startX: rect.left + rect.width / 2 - canvasRect.left,
                        startY: rect.top + rect.height / 2 - canvasRect.top
                    });
                }
            };

            const handlePortMouseUp = (nodeId, type) => {
                if (connecting && type === 'in' && connecting.sourceId !== nodeId) {
                    const exists = edges.find(e => e.source === connecting.sourceId && e.target === nodeId);
                    if (!exists) {
                        setEdges(prev => [...prev, { 
                            id: `e${Date.now()}`, 
                            source: connecting.sourceId, 
                            target: nodeId 
                        }]);
                    }
                }
            };

            const getBezierPath = (x1, y1, x2, y2) => {
                const dx = Math.abs(x2 - x1) * 0.5;
                return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
            };

            const getPortCoords = (nodeId, type) => {
                const node = nodes.find(n => n.id === nodeId);
                if (!node) return { x: 0, y: 0 };
                const x = (node.x * transform.scale) + transform.x + (type === 'out' ? 200 * transform.scale : 0);
                const y = (node.y * transform.scale) + transform.y + (55 * transform.scale); // centered on header
                return { x, y };
            };

            return (
                <div className="flex h-screen w-full bg-[#0f1115] overflow-hidden select-none">
                    {/* LEFT SIDEBAR */}
                    <div className="w-64 border-r border-white/5 bg-[#181a1f] flex flex-col z-20">
                        <div className="p-4 border-b border-white/5 flex items-center gap-2">
                            <div className="w-6 h-6 bg-blue-600 rounded flex items-center justify-center">
                                <IconRenderer name="Cpu" size={14} color="white" />
                            </div>
                            <h1 className="text-xs font-bold uppercase tracking-widest text-slate-200">Islands Flow</h1>
                        </div>
                        <div className="flex-1 overflow-y-auto p-3 space-y-6">
                            {['Trigger', 'Action', 'Control'].map(cat => (
                                <div key={cat}>
                                    <h2 className="text-[10px] font-bold text-slate-500 uppercase mb-2 px-2 tracking-wider">{cat}s</h2>
                                    <div className="space-y-1">
                                        {Object.entries(NODE_TYPES).filter(([_, v]) => v.category === cat).map(([type, def]) => (
                                            <div 
                                                key={type}
                                                className="flex items-center gap-3 p-2 rounded-lg bg-white/[0.02] border border-white/5 hover:bg-white/[0.06] hover:border-white/10 cursor-pointer transition-all group"
                                                onClick={() => setNodes([...nodes, {
                                                    id: `${Date.now()}`,
                                                    type,
                                                    x: 50, y: 50,
                                                    name: def.label,
                                                    props: {}
                                                }])}
                                            >
                                                <div className="p-1.5 rounded-md" style={{ backgroundColor: `${def.color}20`, color: def.color }}>
                                                    <IconRenderer name={def.icon} size={14} />
                                                </div>
                                                <span className="text-sm font-medium text-slate-400 group-hover:text-slate-200">{def.label}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* MAIN CANVAS */}
                    <div 
                        ref={canvasRef}
                        className="flex-1 relative overflow-hidden canvas-grid"
                        onMouseDown={handleCanvasMouseDown}
                        onMouseMove={onMouseMove}
                        onMouseUp={onMouseUp}
                        onWheel={(e) => {
                            const delta = e.deltaY > 0 ? 0.95 : 1.05;
                            setTransform(prev => ({ ...prev, scale: Math.min(Math.max(prev.scale * delta, 0.4), 2) }));
                        }}
                    >
                        {/* Toolbar */}
                        <div className="absolute top-4 left-1/2 -translate-x-1/2 flex items-center gap-1 bg-[#181a1f]/90 backdrop-blur border border-white/10 p-1.5 rounded-xl shadow-2xl z-10">
                            <button className="p-2 hover:bg-white/5 rounded-lg text-slate-400"><IconRenderer name="ZoomIn" size={16}/></button>
                            <button className="p-2 hover:bg-white/5 rounded-lg text-slate-400"><IconRenderer name="ZoomOut" size={16}/></button>
                            <div className="w-px h-4 bg-white/10 mx-1" />
                            <button className="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg transition-colors flex items-center gap-2">
                                <IconRenderer name="Play" size={12} /> Run Flow
                            </button>
                        </div>

                        {/* Connections */}
                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-0">
                            {edges.map(edge => {
                                const start = getPortCoords(edge.source, 'out');
                                const end = getPortCoords(edge.target, 'in');
                                return (
                                    <g key={edge.id}>
                                        <path 
                                            d={getBezierPath(start.x, start.y, end.x, end.y)}
                                            stroke="#3b82f6"
                                            strokeWidth="3"
                                            fill="none"
                                            className="opacity-20"
                                        />
                                        <path 
                                            d={getBezierPath(start.x, start.y, end.x, end.y)}
                                            stroke="#3b82f6"
                                            strokeWidth="1.5"
                                            fill="none"
                                        />
                                    </g>
                                );
                            })}
                            {connecting && (
                                <path 
                                    d={getBezierPath(connecting.startX, connecting.startY, mousePos.x, mousePos.y)}
                                    stroke="#475569"
                                    strokeWidth="2"
                                    strokeDasharray="4 4"
                                    fill="none"
                                />
                            )}
                        </svg>

                        {/* Nodes */}
                        {nodes.map(node => (
                            <div
                                key={node.id}
                                className={`absolute w-[200px] rounded-xl border-2 node-island shadow-2xl overflow-hidden
                                    ${selectedId === node.id ? 'border-blue-500 ring-4 ring-blue-500/10' : 'border-[#2d3139]'}
                                `}
                                style={{ 
                                    left: node.x * transform.scale + transform.x, 
                                    top: node.y * transform.scale + transform.y,
                                    transform: `scale(${transform.scale})`,
                                    transformOrigin: 'top left'
                                }}
                                onMouseDown={(e) => handleNodeMouseDown(e, node)}
                            >
                                <div className="p-3 bg-white/[0.03] border-b border-white/5 flex items-center gap-2">
                                    <div className="p-1 rounded text-white" style={{ backgroundColor: NODE_TYPES[node.type].color }}>
                                        <IconRenderer name={NODE_TYPES[node.type].icon} size={12} />
                                    </div>
                                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-200 flex-1 truncate">
                                        {node.name}
                                    </span>
                                    <IconRenderer name="ChevronRight" size={12} color="#475569" />
                                </div>
                                <div className="p-4 pb-6">
                                    <div className="jetbrains-mono text-[9px] text-slate-500 leading-relaxed">
                                        ID: {node.id.substring(0,8)}<br/>
                                        TYPE: {node.type.split(':')[1]}
                                    </div>
                                </div>

                                {/* Port Dots */}
                                <div 
                                    className="absolute left-0 top-[55px] -translate-x-1/2 w-3 h-3 rounded-full bg-[#0f1115] border-2 border-slate-600 port-dot z-10 cursor-crosshair"
                                    onMouseUp={() => handlePortMouseUp(node.id, 'in')}
                                />
                                <div 
                                    className="absolute right-0 top-[55px] translate-x-1/2 w-3 h-3 rounded-full bg-[#0f1115] border-2 border-slate-600 port-dot z-10 cursor-crosshair"
                                    onMouseDown={(e) => handlePortMouseDown(e, node.id, 'out')}
                                />
                            </div>
                        ))}
                    </div>

                    {/* RIGHT INSPECTOR */}
                    <div className="w-80 border-l border-white/5 bg-[#181a1f] flex flex-col z-20">
                        <div className="p-4 border-b border-white/5 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <IconRenderer name="Settings2" size={14} color="#64748b" />
                                <h2 className="text-xs font-bold uppercase tracking-widest text-slate-500">Inspector</h2>
                            </div>
                            <div className="flex gap-1">
                                <button className="p-1.5 hover:bg-white/5 rounded text-slate-500"><IconRenderer name="Copy" size={14}/></button>
                                <button 
                                    className="p-1.5 hover:bg-red-500/10 hover:text-red-500 rounded text-slate-500"
                                    onClick={() => {
                                        if (selectedId) {
                                            setNodes(nodes.filter(n => n.id !== selectedId));
                                            setEdges(edges.filter(e => e.source !== selectedId && e.target !== selectedId));
                                            setSelectedId(null);
                                        }
                                    }}
                                >
                                    <IconRenderer name="Trash2" size={14}/>
                                </button>
                            </div>
                        </div>
                        
                        <div className="flex-1 p-4 space-y-6 overflow-y-auto">
                            {selectedId ? (
                                <div className="space-y-4">
                                    <div className="p-3 rounded-xl bg-blue-500/5 border border-blue-500/10">
                                        <label className="text-[10px] font-bold text-blue-400 uppercase block mb-2">Island Identity</label>
                                        <input 
                                            className="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-blue-500 outline-none transition-colors"
                                            value={nodes.find(n => n.id === selectedId)?.name || ''}
                                            onChange={(e) => {
                                                const val = e.target.value;
                                                setNodes(prev => prev.map(n => n.id === selectedId ? { ...n, name: val } : n));
                                            }}
                                        />
                                    </div>

                                    <div className="space-y-3 pt-2">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase block tracking-widest">Configuration</label>
                                        <div className="space-y-4">
                                            <div className="space-y-1">
                                                <span className="text-[11px] text-slate-400 px-1">Trigger Path</span>
                                                <div className="flex gap-2">
                                                    <select className="flex-1 bg-black/20 border border-white/5 rounded-lg px-2 py-1.5 text-xs text-slate-300 outline-none">
                                                        <option>On State Change</option>
                                                        <option>On Timer</option>
                                                        <option>On API Call</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="space-y-1">
                                                <span className="text-[11px] text-slate-400 px-1">Logic Pattern</span>
                                                <input type="text" className="w-full bg-black/20 border border-white/5 rounded-lg px-3 py-1.5 text-xs text-slate-300 outline-none focus:border-white/20" placeholder="$value > 50" />
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="pt-6">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase block mb-2">Raw JSON Data</label>
                                        <div className="jetbrains-mono text-[10px] bg-black/40 p-3 rounded-lg border border-white/5 text-blue-300/70 overflow-x-auto whitespace-pre">
                                            {JSON.stringify(nodes.find(n => n.id === selectedId), null, 2)}
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="h-full flex flex-col items-center justify-center text-center p-6 space-y-4 opacity-40">
                                    <div className="w-12 h-12 rounded-full border-2 border-dashed border-slate-700 flex items-center justify-center">
                                        <IconRenderer name="Settings2" size={20} />
                                    </div>
                                    <p className="text-xs text-slate-500 font-medium">Select an island on the canvas to configure parameters</p>
                                </div>
                            )}
                        </div>

                        <div className="p-4 border-t border-white/5 bg-black/20">
                            <button className="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-blue-600/10 hover:bg-blue-600/20 border border-blue-600/20 rounded-xl text-xs font-bold text-blue-400 transition-all">
                                <IconRenderer name="Download" size={14}/> Export Workflow
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
