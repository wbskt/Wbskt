# RabbitMQ sizes its memory alarm from the VM's RAM (/proc/meminfo), not from the container's
# mem_limit, so without this its 60% watermark sits above the 1g cap and the kernel kills the broker
# before the alarm can block publishers. Keep this equal to rabbitmq's mem_limit in docker-compose.yml.
total_memory_available_override_value = 1GiB
