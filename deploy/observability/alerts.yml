# The handful of conditions that mean a customer is affected or data is at risk. Each one names
# what to look at first. Thresholds are starting points: tune them once there is a baseline.
#
# Deliberately absent: an alert on engine readiness. Only the leader reports ready; a standby is a
# healthy process that is not ready by design, and alerting on it pages for normal behaviour.
# EngineNotReporting below covers "no engine at all".
groups:
  - name: wbskt
    rules:
      - alert: WorkflowRunFailureRateHigh
        expr: |
          (
            sum(increase(wbskt_workflow_runs_completed_total{status=~"Failed|PartiallyFailed"}[15m]))
              / sum(increase(wbskt_workflow_runs_completed_total[15m]))
          ) > 0.25
          and sum(increase(wbskt_workflow_runs_completed_total[15m])) >= 20
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $value | humanizePercentage }} of workflow runs failed over the last 15 minutes"
          description: >-
            Break it down by workspace_id and workflow_ref in Grafana to tell one tenant's broken
            workflow from a platform fault, then follow a failed run's trace in Tempo.

      - alert: WorkflowWakeBacklog
        # Timers and timeouts that fell due over a minute ago and nobody claimed. max, not sum: every
        # engine replica reports the same database-wide count.
        expr: max(wbskt_workflow_bookmarks_overdue) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} workflow wake-ups are overdue and unclaimed"
          description: >-
            The engine leader is stuck, behind, or absent. Check the engine logs and which replica
            holds leadership.

      - alert: WorkflowDispatchBacklog
        expr: max(wbskt_workflow_dispatcher_queue_depth) > 500
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} branches are queued for execution in the engine"

      - alert: WorkspaceRunCeilingReached
        # A workspace with as many active runs as WorkflowEngine:MaxActiveRunsPerWorkspace allows has
        # its triggers refused (sub-workflow children fail retryably) until runs finish.
        expr: sum by (workspace_id) (increase(wbskt_workflow_runs_refused_total[10m])) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Workspace {{ $labels.workspace_id }} is refusing triggers at its active-run ceiling"
          description: >-
            Look for runs piling up in that workspace (a stuck wait, a trigger firing far faster
            than its runs finish). Raise the ceiling only if the load is legitimate.

      - alert: DeadLetteredMessages
        # MassTransit moves a message that exhausted its retries to <queue>_error, and one with no
        # consumer to <queue>_skipped. Either is an event some host never handled.
        expr: sum by (queue) (rabbitmq_detailed_queue_messages_ready{queue=~".+_(error|skipped)"}) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} messages dead-lettered in {{ $labels.queue }}"
          description: >-
            Inspect them in the RabbitMQ management UI (or the logs for the consumer's exception),
            fix the cause, then move them back to the source queue.

      - alert: CallbackQueueBacklog
        # Public webhooks and wakes wait here for the engine. The broker caps the queue at 10,000
        # callbacks or 64 MiB, whichever comes first (deploy/observability/rabbitmq/healthcheck.sh);
        # once full, callers get 503s. This fires at a tenth of the count, CallbackQueueBytesBacklog
        # at a tenth of the bytes.
        expr: max(rabbitmq_detailed_queue_messages_ready{queue="workflow-inbound-callback"}) > 1000
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} public callbacks are waiting for the workflow engine"
          description: >-
            The engine is down or not keeping up. At 10,000 callbacks or 64 MiB the queue refuses
            more and webhook callers are answered 503 until it drains.

      - alert: CallbackQueueBytesBacklog
        # Webhook bodies can be up to 128 KiB, so about 512 large callbacks fill the 64 MiB cap long
        # before the count alert above sees 1,000. Needs the queue_metrics family (prometheus.yml).
        expr: max(rabbitmq_detailed_queue_messages_ready_bytes{queue="workflow-inbound-callback"}) > 6 * 1024 * 1024
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value | humanize1024 }}B of public callbacks are waiting for the workflow engine"
          description: >-
            The engine is down or not keeping up. At 64 MiB (or 10,000 callbacks) the queue refuses
            more and webhook callers are answered 503 until it drains.

      - alert: SocketDisconnectRateHigh
        # Abnormal disconnects only: client_closed is a device signing off, server_stopping a deploy.
        expr: |
          sum(increase(wbskt_socket_disconnects_total{reason=~"aborted|error"}[10m]))
            / clamp_min(sum(wbskt_socket_connections_open), 10)
          > 0.5
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Devices are dropping off the socket tier faster than usual"
          description: >-
            More abnormal disconnects in 10 minutes than half the connected devices. Look for a
            network or proxy problem in front of ws.<domain>, or a socket host restarting.

      - alert: DeletedWorkspaceRetiredBySweep
        # Management's daily deleted workspace sweep found a workspace the auth host had deleted that
        # still had live policies, clients, workflows or runs, and retired it. Each one is a
        # WorkspaceDeletedEvent that was lost or whose handling gave up. 25h: one daily sweep's worth.
        expr: sum(increase(wbskt_management_workspaces_retired_by_sweep_total[25h])) > 0
        labels:
          severity: warn
        annotations:
          summary: "The deleted workspace sweep retired {{ $value }} workspace(s) the delete event missed"
          description: >-
            The sweep has already repaired them. Find out why the event did not: the management
            log's "was deleted but still had live content" warning names each workspace, and a
            WorkspaceDeletedEvent dead-lettered in a management _error queue is the usual cause.

      - alert: BackupMissing
        # backup.sh pushes this timestamp only after a verified backup has been uploaded.
        expr: time() - max(wbskt_backup_last_success_timestamp_seconds) > 26 * 3600
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "No successful database backup for over 26 hours"
          description: Check /var/log/wbskt-backup.log on the VM and that the cron entry still exists.

      - alert: BackupNeverReported
        expr: absent(wbskt_backup_last_success_timestamp_seconds)
        for: 26h
        labels:
          severity: page
        annotations:
          summary: "The backup job has never reported a success to this Prometheus"

      - alert: EngineNotReporting
        expr: absent(wbskt_workflow_dispatcher_queue_depth)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No workflow engine has reported metrics for 5 minutes"

      - alert: DiskAlmostFull
        # Every real filesystem on the VM: /, and the image store or SQL volume if they are separate.
        # At 15% free a deploy's pull or a SQL Server autogrow is close to failing.
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}
          < 0.15
          and node_filesystem_readonly == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.mountpoint }} on the VM has {{ $value | humanizePercentage }} free"
          description: >-
            Follow "Disk space" in deploy/README.md: find what grew with docker system df and du,
            prune unused images, vacuum the journal. Never prune volumes.

      - alert: DiskFillingFast
        # Early warning: at the last six hours' rate, the filesystem is full within a day.
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.40
          and node_filesystem_readonly == 0
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.mountpoint }} on the VM will be full within 24 hours at the current rate"
          description: Look for a runaway log, local backups piling up, or images not being pruned.

      - alert: NodeExporterDown
        # Without it the two disk alerts above can never fire.
        expr: absent(up{job="node"} == 1)
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Prometheus cannot scrape node-exporter, so disk space is unwatched"

      - alert: ContainerRestarting
        # A container that crashes and is restarted in place keeps its series, so its start time
        # changes. A deploy recreates containers under new ids and does not count.
        expr: |
          sum by (container_label_com_docker_compose_service, name) (
            changes(container_start_time_seconds{name!=""}[15m])
          ) >= 3
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.name }} restarted {{ $value }} times in 15 minutes"
          description: >-
            It is crash-looping. docker logs --tail 200 {{ $labels.name }} on the VM shows why; a
            container stopped by its memory limit shows OOMKilled in docker inspect.
