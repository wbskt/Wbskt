# The handful of conditions that mean a customer is affected or data is at risk. Each one names
# what to look at first. Thresholds are starting points: tune them once there is a baseline.
#
# The annotations are what the alert email shows (alert-email.tmpl), to someone who may not know the
# stack: summary (what happened, one sentence; also the subject), impact (what it means for customers
# or data), action (what to do), and optionally command (the first thing to run on the VM) and
# dashboard (a Grafana path, the overview dashboard otherwise).
#
# Deliberately absent: an alert on engine readiness. Only the leader reports ready; a standby is a
# healthy process that is not ready by design, and alerting on it pages for normal behaviour.
# EngineNotReporting below covers "no engine at all".
groups:
  - name: wbskt
    rules:
      - alert: Watchdog
        # Always firing, on purpose. Alertmanager sends it to ALERT_DEADMANS_URL every 5 minutes, and
        # the service there alerts when it stops arriving: the VM is down, offline, out of disk, or
        # Prometheus or Alertmanager stopped. Every other rule is evaluated and sent from this VM, so
        # nothing else can report that. It never reaches the email or webhook receivers. A route or
        # inhibit rule keyed on severity must leave it out.
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "The alerting pipeline is working; this alert always fires"
          impact: >-
            None. It is never emailed: it goes only to the dead man's switch (ALERT_DEADMANS_URL), so a
            service outside the VM notices when alerts stop being sent.
          action: >-
            Nothing to do. Never silence it, or the outside service decides the VM is down.

      - alert: WorkflowRunFailureRateHigh
        expr: |
          (
            sum(increase(wbskt_workflow_runs_completed_total{status=~"Failed|PartiallyFailed"}[15m]))
              / sum(increase(wbskt_workflow_runs_completed_total[15m]))
          ) > 0.25
          and sum(increase(wbskt_workflow_runs_completed_total[15m])) >= 20
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $value | humanizePercentage }} of workflow runs failed in the last 15 minutes"
          impact: >-
            Customers' automations are not finishing. If one customer's workflow is broken, only they are
            affected; if runs fail across many workspaces, the platform itself has a fault.
          action: >-
            On the Grafana dashboard, break the failures down by workspace_id and workflow_ref. One workflow
            failing over and over is usually the customer's own setup. Failures spread across workspaces
            point at the engine: open a failed run's trace in Grafana (Explore, Tempo) to see the step that
            failed.
          command: "docker compose logs --tail 200 engine"

      - alert: WorkflowWakeBacklog
        # Timers and timeouts that fell due over a minute ago and nobody claimed. max, not sum: every
        # engine replica reports the same database-wide count.
        expr: max(wbskt_workflow_bookmarks_overdue) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} workflow timers and timeouts are overdue and nobody has picked them up"
          impact: >-
            Workflows waiting on a delay, a schedule or a timeout are stuck and will not move on, so
            customers see their automations hang.
          action: >-
            The workflow engine is stuck, behind, or not running. Check that an engine container is up and
            read its recent logs. Restarting it is safe: the waiting steps are kept in the database and are
            picked up again.
          command: "docker compose ps engine && docker compose logs --tail 200 engine"

      - alert: WorkflowDispatchBacklog
        expr: max(wbskt_workflow_dispatcher_queue_depth) > 500
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} workflow steps are queued in the engine, waiting to run"
          impact: >-
            Workflows are running late. Nothing is lost, but customers' automations react more slowly than
            usual.
          action: >-
            Usually a burst of triggers, or one workflow looping fast. If the queue keeps growing, look on
            the Grafana dashboard for a workflow running far more than usual, and at the engine's logs.
          command: "docker compose logs --tail 200 engine"

      - alert: MailRelayDown
        # The auth host gave up on at least two mails and sent none in 15 minutes: the relay is refusing
        # everything (expired credential, sending limit, outage, or "relaying denied", which arrives as a
        # refused recipient). Every confirmation, invitation and password reset goes this way, and sign-in
        # needs a confirmed address, so nobody new can get in. Two, so one mistyped address at a quiet
        # hour does not page.
        expr: |
          sum(increase(wbskt_auth_mail_total{outcome=~"dropped|queue_full|rejected"}[15m])) >= 2
          and (sum(increase(wbskt_auth_mail_total{outcome="sent"}[15m])) or vector(0)) == 0
        labels:
          severity: page
        annotations:
          summary: "Outgoing email has stopped: none sent in 15 minutes, {{ $value | printf \"%.0f\" }} given up on"
          impact: >-
            Sign-up confirmations, invitations and password resets are not being delivered. New users cannot
            confirm their address, so they cannot sign in.
          action: >-
            The mail relay is refusing everything or cannot be reached: often an expired password, a sending
            limit, or the provider being down. The auth host's "was not sent after" and "was refused by the
            relay" log lines carry the relay's error code. If the SMTP_* settings in .env changed, fix them
            and restart auth. This alert is mailed through that same relay, so it reaches anyone only when
            ALERT_WEBHOOK_URL is set too.
          command: "docker compose logs --since 1h auth | grep -E \"was not sent after|refused by the relay\""

      - alert: MailFailing
        # Some mail was given up on after its retries (about 10 seconds), or refused by a full queue,
        # while other mail still went out: a relay blip, or a backlog building. Quiet while MailRelayDown
        # holds (the same condition, repeated), so one outage notifies once.
        expr: |
          sum(increase(wbskt_auth_mail_total{outcome=~"dropped|queue_full"}[15m])) > 0
          unless on() (
            sum(increase(wbskt_auth_mail_total{outcome=~"dropped|queue_full|rejected"}[15m])) >= 2
            and (sum(increase(wbskt_auth_mail_total{outcome="sent"}[15m])) or vector(0)) == 0
          )
        labels:
          severity: warn
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} outgoing emails were given up on in the last 15 minutes"
          impact: >-
            Some people did not get a confirmation, invitation or password reset email. Other mail is still
            going out, and they can ask for theirs again.
          action: >-
            Usually a short hiccup at the mail relay; if it repeats, the auth host's error lines name the
            relay's error code. An outcome of queue_full means mail is being asked for faster than it can be
            sent.
          command: "docker compose logs --since 1h auth | grep -E \"was not sent after|refused by the relay\""

      - alert: BillingWebhooksSetAside
        # A payment webhook that names no tenant here, no plan or pack on offer, or a subscription the
        # provider does not know. For a paying customer that means a tenant left on the wrong plan or
        # without the credits it bought, with nothing else to say so.
        expr: sum by (type) (increase(wbskt_auth_billing_webhooks_total{outcome="set_aside"}[1h])) > 0
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} {{ $labels.type }} payment notifications could not be matched to a customer or plan"
          impact: >-
            A customer may have paid and been left on the wrong plan or without the credits they bought, and
            nothing else will flag it.
          action: >-
            Read why each was set aside in dbo.BillingWebhookEvents.LastError (auth database) or the auth
            host's "Set aside" log line. A subscription naming no tenant usually means the checkout's
            metadata did not reach it; a product not on offer means a DODO_PRODUCT_* id is missing from
            .env. Fix the cause, then replay the event from the payment provider's dashboard.
          command: "docker compose logs --since 2h auth | grep \"Set aside\""

      - alert: BillingWebhooksFailing
        # The provider delivers a failed webhook again, so one failure is noise; several in an hour mean
        # the provider's API or the auth database is refusing us.
        expr: sum(increase(wbskt_auth_billing_webhooks_total{outcome="failed"}[1h])) > 5
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} payment notifications failed to process in the last hour"
          impact: >-
            Plan changes and credit purchases are delayed. The payment provider sends each one again, so
            nothing is lost yet, but it stops trying after about a day.
          action: >-
            The provider's API or the auth database is refusing us. The auth host's logs carry the
            provider's status codes, and the unprocessed rows are in dbo.BillingWebhookEvents.
          command: "docker compose logs --since 2h auth | grep -i webhook"

      - alert: BillingRefundUnconfirmed
        # A duplicate subscription's refund timed out or the provider answered with an error that does not
        # say nothing happened. It is not asked for again, since that could refund twice, so a person has
        # to check whether the customer got their money back.
        expr: sum(increase(wbskt_auth_billing_refunds_total{outcome="unconfirmed"}[1h])) > 0
        labels:
          severity: warn
        annotations:
          summary: "A refund for a customer's duplicate subscription may not have gone through"
          impact: >-
            A customer who was charged twice may not have got their money back. It is not retried on its
            own, because that could refund them twice.
          action: >-
            The auth host's error log names the payment. Look it up in the payment provider's dashboard and,
            if no refund is there, refund it by hand. The host will not ask again (its claim stays on
            dbo.TenantSubscriptions).
          command: "docker compose logs --since 2h auth | grep -i refund"

      - alert: BillingReconcileFailing
        # The daily reconcile reads the provider's recent subscriptions and payments again in case their
        # webhooks never arrived. One it could not read, or a list it could not read or had to cut short,
        # is tried again the next day, but only while it is inside the three-day window, so about three
        # bad days in a row lose it.
        expr: sum(increase(wbskt_auth_billing_reconciles_total{outcome=~"failed|truncated"}[1d])) > 0
        labels:
          severity: warn
        annotations:
          summary: "The daily billing check could not verify {{ $value }} subscriptions, payments or lists"
          impact: >-
            The daily check that catches payment notifications we never received did not finish. It tries
            again each day for three days; after that a missed payment or plan change is lost.
          action: >-
            The auth host's "Could not reconcile" and "Could not list" log lines name each one and the
            provider's answer (a cut-short list logs "stopped"). Fix the cause before the next run, or
            replay the events from the payment provider's dashboard.
          command: "docker compose logs --since 24h auth | grep -E \"Could not (reconcile|list)|stopped\""

      - alert: BillingWebhookSignaturesRefused
        # Deliveries that carry a signature which does not hold up usually mean the signing secret was
        # rotated on one side only (a request with no signature is counted apart, as signature_missing).
        # The provider's retries are spread over about a day and events lost then are not sent again, so
        # the window is two hours: wide enough to see a quiet day's few deliveries, short of that day.
        expr: sum(increase(wbskt_auth_billing_webhooks_total{outcome="signature_invalid"}[2h])) > 2
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} payment notifications were rejected because their signature did not match"
          impact: >-
            Payment events are being thrown away, so subscriptions and purchases are not applied. The
            provider stops retrying after about a day, and events lost then are not sent again.
          action: >-
            The webhook signing secret was most likely changed on one side only. Compare
            DODO_PAYMENTS_WEBHOOK_KEY in .env with the webhook's secret in the payment provider's dashboard,
            make them match and restart auth. Then replay the rejected deliveries from the provider's
            dashboard.
          command: "docker compose logs --since 2h auth | grep -i signature"

      - alert: CreditGrantsRepaired
        # The hourly reconcile wrote a credit grant change an event should have: a pack paid for whose
        # credits never arrived, or a refund or chargeback that was not applied. Repaired now, but the
        # event path that lost it needs a look.
        expr: sum by (change) (increase(wbskt_management_credit_grants_repaired_total[2h])) > 0
        labels:
          severity: warn
        annotations:
          summary: "The hourly credit check fixed {{ $value }} {{ $labels.change }} change(s) that had gone missing"
          impact: >-
            Some customers' credit balances were wrong for up to an hour (a pack paid for but not credited,
            or a refund not taken off). They are correct now.
          action: >-
            Nothing for the customer. Find out why the event was lost: the management host's "Repaired the
            credit grant" log lines name the payments; look for Tenant credit events in the dead-letter
            queues (RabbitMQ UI) and the auth outbox.
          command: "docker compose logs --since 3h management | grep \"Repaired the credit grant\""

      - alert: WorkspaceRunCeilingReached
        # A workspace whose plan already has as many active runs as it allows (PlanLimits.ActiveRuns,
        # pooled across the tenant's workspaces) has its triggers refused (sub-workflow children fail
        # retryably) until runs finish.
        expr: sum by (workspace_id) (increase(wbskt_workflow_runs_refused_total[10m])) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Workspace {{ $labels.workspace_id }} is at its plan's limit of running workflows and is turning new ones away"
          impact: >-
            One customer's new workflow runs are refused until some of theirs finish. Other customers are
            not affected.
          action: >-
            Look in that workspace for runs piling up: a run stuck waiting, or a trigger firing much faster
            than its runs finish. If the load is real, the customer needs a bigger plan or a limit override.

      - alert: DeadLetteredMessages
        # MassTransit moves a message that exhausted its retries to <queue>_error, and one with no
        # consumer to <queue>_skipped. Either is an event some host never handled.
        expr: sum by (queue) (rabbitmq_detailed_queue_messages_ready{queue=~".+_(error|skipped)"}) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} background messages failed and were set aside in {{ $labels.queue }}"
          impact: >-
            Work the platform does between its services was not done: depending on the queue, a device
            update, a billing change or a workflow event never happened.
          action: >-
            In the RabbitMQ management UI, read the messages in that queue, and read the logs of the service
            that consumes it for the exception. Fix the cause, then move the messages back to the original
            queue (the same name without _error or _skipped) so they are processed.
          command: "ssh -L 15672:127.0.0.1:15672 <your VM>, then open http://localhost:15672"

      - alert: CallbackQueueBacklog
        # Public webhooks and wakes wait here for the engine. The broker caps the queue at 10,000
        # callbacks or 64 MiB, whichever comes first (deploy/observability/rabbitmq/healthcheck.sh);
        # once full, callers get 503s. This fires at a tenth of the count, CallbackQueueBytesBacklog
        # at a tenth of the bytes.
        expr: max(rabbitmq_detailed_queue_messages_ready{queue="workflow-inbound-callback"}) > 1000
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} incoming webhooks are waiting for the workflow engine"
          impact: >-
            Customers' webhook-triggered workflows are delayed. At 10,000 waiting (or 64 MiB), new webhook
            calls are refused with an error until the queue drains.
          action: >-
            The workflow engine is down or not keeping up. Check that it is running and read its logs.
          command: "docker compose ps engine && docker compose logs --tail 200 engine"

      - alert: CallbackQueueBytesBacklog
        # Webhook bodies can be up to 128 KiB, so about 512 large callbacks fill the 64 MiB cap long
        # before the count alert above sees 1,000. Needs the queue_metrics family (prometheus.yml).
        expr: max(rabbitmq_detailed_queue_messages_ready_bytes{queue="workflow-inbound-callback"}) > 6 * 1024 * 1024
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value | humanize1024 }}B of incoming webhooks are waiting for the workflow engine"
          impact: >-
            Customers' webhook-triggered workflows are delayed. At 64 MiB (or 10,000 waiting), new webhook
            calls are refused with an error until the queue drains.
          action: >-
            The workflow engine is down or not keeping up. Check that it is running and read its logs.
          command: "docker compose ps engine && docker compose logs --tail 200 engine"

      - alert: SocketDisconnectRateHigh
        # Abnormal disconnects only: client_closed is a client signing off, server_stopping a deploy.
        # Per transport, so a WebSocket or MQTT tier in trouble is not hidden by the other's clients.
        expr: |
          sum by (transport) (increase(wbskt_socket_disconnects_total{reason=~"aborted|error"}[10m]))
            / clamp_min(sum by (transport) (wbskt_socket_connections_open), 10)
          > 0.5
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Devices are dropping off the {{ $labels.transport }} connection much faster than usual"
          impact: >-
            Customers' devices keep disconnecting unexpectedly, so commands and readings are delayed or
            missed while they reconnect.
          action: >-
            More devices dropped in 10 minutes than half of those connected. Look for a network or proxy
            problem in front of ws.<domain> (websocket) or mqtt.<domain> (mqtt), or a gateway container
            restarting.
          command: "docker compose ps traefik gateway-ws gateway-mqtt"

      - alert: RevokeMissedByGateway
        # The gateway's access re-check closed a connection whose revoke, delete or secret rotation
        # event never reached it: the client stayed connected until the re-check, up to a minute.
        expr: sum by (transport) (increase(wbskt_socket_access_recheck_closed_total[15m])) > 0
        labels:
          severity: warn
        annotations:
          summary: "A {{ $labels.transport }} gateway missed {{ $value | humanize }} device access removals and caught them late"
          impact: >-
            A device whose access was revoked, deleted or rotated stayed connected for up to a minute longer
            than it should have. It has been disconnected now.
          action: >-
            The gateway lost its connection to RabbitMQ while the access change happened, so the event was
            lost; its once-a-minute re-check closed the connection instead. Look at the gateway's RabbitMQ
            connection drops around that time. If it keeps happening, the link to the broker is unstable.

      - alert: DeletedWorkspaceRetiredBySweep
        # Management's daily deleted workspace sweep found a workspace the auth host had deleted that
        # still had live policies, clients, workflows or runs, and retired it. Each one is a
        # WorkspaceDeletedEvent that was lost or whose handling gave up. 25h: one daily sweep's worth.
        expr: sum(increase(wbskt_management_workspaces_retired_by_sweep_total[25h])) > 0
        labels:
          severity: warn
        annotations:
          summary: "The daily cleanup removed {{ $value }} deleted workspace(s) whose devices or workflows were still live"
          impact: >-
            A workspace a customer deleted kept its devices, policies or workflows running for up to a day.
            The cleanup has removed them now.
          action: >-
            Find out why the delete event was lost: the management log's "was deleted but still had live
            content" warning names each workspace, and a WorkspaceDeletedEvent left in a management _error
            queue is the usual cause.
          command: "docker compose logs --since 25h management | grep \"still had live content\""

      - alert: BackupMissing
        # backup.sh pushes this timestamp only after a verified backup has been uploaded.
        expr: time() - max(wbskt_backup_last_success_timestamp_seconds) > 26 * 3600
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "No database backup has succeeded for over 26 hours"
          impact: >-
            If the database were lost now, everything since the last good backup would be lost with it.
          action: >-
            Read the backup log on the VM for the error, and check that the cron entry still exists (crontab
            -l). Once fixed, run backup.sh by hand to take a backup straight away.
          command: "tail -50 /var/log/wbskt-backup.log"

      - alert: BackupNeverReported
        expr: absent(wbskt_backup_last_success_timestamp_seconds)
        for: 26h
        labels:
          severity: page
        annotations:
          summary: "The backup job has never reported a successful backup"
          impact: >-
            There may be no backups at all: if the database were lost, its data could not be restored.
          action: >-
            Check that the nightly backup is in the crontab and that it pushes to the Pushgateway (see
            Backups in deploy/README.md). Run backup.sh by hand and read its output.
          command: "tail -50 /var/log/wbskt-backup.log"

      - alert: DatabaseNearExpressLimit
        # backup.sh pushes each database's allocated data-file size nightly. SQL Server Express caps
        # a database's data at 10 GB, and past it every insert that needs a new page fails.
        expr: max by (database) (wbskt_sql_data_file_bytes) > 8 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "The {{ $labels.database }} database is at {{ $value | humanize1024 }}B, nearing SQL Server Express's 10 GB limit"
          impact: >-
            Nothing is failing yet. At 10 GB the database stops accepting new data, which would stop
            readings, workflow runs and audit for every customer.
          action: >-
            Find what grew (sp_spaceused per table). If it is free space left by deleted rows, shrink the
            file once (DBCC SHRINKFILE). If it is real data, plan the move off Express now. See "SQL Server
            edition" in deploy/README.md.

      - alert: DatabaseAtExpressLimit
        # Past the warning and still growing: at 10 GB every insert needing a new page fails, which
        # stops readings, runs and audit for every customer at once, so this one wakes someone.
        expr: max by (database) (wbskt_sql_data_file_bytes) > 9 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "The {{ $labels.database }} database is at {{ $value | humanize1024 }}B; at 10 GB it stops accepting new data"
          impact: >-
            Close to an outage for every customer: past 10 GB, new readings, workflow runs and audit entries
            cannot be saved.
          action: >-
            The same steps as the near-limit warning, now urgent: shrink the file if it is free space, or
            cut readings retention and move off Express. See "SQL Server edition" in deploy/README.md.

      - alert: EngineNotReporting
        # Held back while the collector is down: OtelCollectorDown is the one cause then.
        expr: |
          absent(wbskt_workflow_dispatcher_queue_depth)
          unless on () absent(up{job="otel-collector"} == 1)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The workflow engine has been silent for about 10 minutes"
          impact: >-
            Either the engine is down, so no customer workflow is running, or it is running but its
            monitoring is broken, so the workflow alerts cannot fire.
          action: >-
            Check whether the engine container is running and read its logs. If it stopped, start it again.
          command: "docker compose ps engine && docker compose logs --tail 200 engine"

      - alert: HostNotReporting
        # A host that stopped or lost its exporter sends nothing, and nothing else would say so: only the
        # engine had a rule. target_info comes with every push (job = OTEL_SERVICE_NAME), and
        # dotnet_process_cpu_count from the runtime meter, so either is there while the host is up. One
        # alert per service, firing once every replica of it is gone. OTLP series get no staleness marker,
        # so a series lingers for the 5m lookback before for: starts: about 10 minutes in all. Held back
        # while the collector is down, as EngineNotReporting is.
        expr: |
          (
            absent({__name__=~"target_info|dotnet_process_cpu_count", job="wbskt-auth"})
            or absent({__name__=~"target_info|dotnet_process_cpu_count", job="wbskt-management"})
            or absent({__name__=~"target_info|dotnet_process_cpu_count", job="wbskt-client-auth"})
            or absent({__name__=~"target_info|dotnet_process_cpu_count", job="wbskt-gateway-ws"})
            or absent({__name__=~"target_info|dotnet_process_cpu_count", job="wbskt-gateway-mqtt"})
          )
          unless on () absent(up{job="otel-collector"} == 1)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The {{ $labels.job | reReplaceAll \"^wbskt-\" \"\" }} service has been silent for about 10 minutes"
          impact: >-
            Either that service is down, so what it does (sign-in for auth, the console's API for
            management, device connections for client-auth and the gateways) is failing, or it is running
            but its monitoring is broken.
          action: >-
            Check whether it is running and read its recent logs. A service deliberately scaled to 0
            replicas fires this too.
          command: "docker compose ps {{ $labels.job | reReplaceAll \"^wbskt-\" \"\" }} && docker compose logs --tail 200 {{ $labels.job | reReplaceAll \"^wbskt-\" \"\" }}"

      - alert: PeriodicJobFailing
        # A periodic job (credit posting, reconciles, retention, the deleted-workspace sweep, the
        # gateways' access recheck) logs a failed tick and carries on, so one that fails every time stays
        # quiet. Per container, so a healthy replica cannot hide a failing one. Any of:
        # - it has failed every tick since its container started. Read off the raw counters, because a
        #   series that first appears at 1 is a step increase() cannot see: a daily job's only tick
        #   after a deploy, or a new engine leader's first.
        # - most of its last 30 minutes' ticks failed, and more than two (jobs that run every 10 minutes
        #   or more often; slower ones are left to the next arm).
        # - it failed and has not once succeeded in 6 hours (hourly jobs) or 49 hours (daily ones). A
        #   job's first failure on a container makes a series increase() cannot see, so a daily job that
        #   once succeeded alerts on its second failure in a row.
        # Containers that stopped pushing drop out through target_info, so a deploy or a dead engine
        # clears the alert. An engine demoted to standby keeps pushing its old counters, so a failure it
        # had as leader holds the alert until it restarts or the window passes.
        expr: |
          (
            (
              sum by (job, instance, worker) ({__name__=~"wbskt_(auth|management|workflow|gateway)_worker_ticks_total", outcome="failed"}) > 0
              unless on (job, instance, worker) sum by (job, instance, worker) ({__name__=~"wbskt_(auth|management|workflow|gateway)_worker_ticks_total", outcome="ok"}) > 0
            )
            or (
              sum by (job, instance, worker) (increase({__name__=~"wbskt_(auth|management|workflow|gateway)_worker_ticks_total", outcome="failed"}[30m]))
                / sum by (job, instance, worker) (increase({__name__=~"wbskt_(auth|management|workflow|gateway)_worker_ticks_total"}[30m])) > 0.5
              and sum by (job, instance, worker) (increase({__name__=~"wbskt_(auth|management|workflow|gateway)_worker_ticks_total", outcome="failed"}[30m])) > 2
            )
            or (
              sum by (job, instance, worker) (increase({__name__=~"wbskt_(auth|management|workflow|gateway)_worker_ticks_total", outcome="failed"}[6h])) > 0
              unless on (job, instance, worker) sum by (job, instance, worker) (increase({__name__=~"wbskt_(auth|management|workflow|gateway)_worker_ticks_total", outcome="ok"}[6h])) > 0
            )
            or (
              sum by (job, instance, worker) (increase({__name__=~"wbskt_(auth|management|workflow|gateway)_worker_ticks_total", outcome="failed"}[49h])) > 0
              unless on (job, instance, worker) sum by (job, instance, worker) (increase({__name__=~"wbskt_(auth|management|workflow|gateway)_worker_ticks_total", outcome="ok"}[49h])) > 0
            )
          )
          and on (job, instance) group by (job, instance) (target_info)
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "The background job {{ $labels.worker }} on {{ $labels.job | reReplaceAll \"^wbskt-\" \"\" }} keeps failing"
          impact: >-
            A scheduled job (credit posting, billing checks, data retention, the deleted-workspace cleanup,
            or device access re-checks) is not doing its work. What breaks depends on the job, and usually
            builds up slowly.
          action: >-
            Its error lines name the failure: the service's logs, or Loki in Grafana with {service_name="{{
            $labels.job }}"} |= "{{ $labels.worker }}". It runs again on its own once the cause is fixed.
          command: "docker compose logs --since 1h {{ $labels.job | reReplaceAll \"^wbskt-\" \"\" }} | grep \"{{ $labels.worker }}\""

      - alert: DiskAlmostFull
        # Every real filesystem on the VM: /, and the image store or SQL volume if they are separate.
        # At 15% free a deploy's pull or a SQL Server autogrow is close to failing.
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}
          < 0.15
          and node_filesystem_readonly == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "The VM's disk at {{ $labels.mountpoint }} is almost full: {{ $value | humanizePercentage }} free"
          impact: >-
            When it fills, the database stops saving data and deploys fail, which takes the whole platform
            down.
          action: >-
            Follow "Disk space" in deploy/README.md: find what grew with docker system df and du, remove
            unused images, and trim the system journal. Never prune Docker volumes: they hold the data.
          command: "df -h && docker system df"

      - alert: DiskFillingFast
        # Early warning: at the last six hours' rate, the filesystem is full within a day.
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.40
          and node_filesystem_readonly == 0
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: "The VM's disk at {{ $labels.mountpoint }} will be full within 24 hours at the current rate"
          impact: >-
            Nothing is failing yet, but when the disk fills the database stops saving data and the platform
            goes down.
          action: >-
            Look for a runaway log, local backups piling up, or old images not being removed. See "Disk
            space" in deploy/README.md.
          command: "df -h && docker system df"

      - alert: NodeExporterDown
        # Without it the two disk alerts above can never fire.
        expr: absent(up{job="node"} == 1)
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "The VM's disk space is no longer being watched"
          impact: >-
            The disk-full alerts cannot fire while this lasts, so the disk could fill up without warning.
          action: >-
            node-exporter, the small container that reports disk space, is down. Start it again.
          command: "docker compose up -d node-exporter"

      - alert: OtelCollectorDown
        # Every host sends traces, metrics and logs through it, so while it is down EngineNotReporting
        # and the workflow alerts go quiet too. It has no Docker healthcheck to show this instead.
        expr: absent(up{job="otel-collector"} == 1)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Monitoring data from the services has stopped arriving"
          impact: >-
            Customers may not notice anything, but while this lasts the workflow, engine and service alerts
            cannot fire, so a real outage would go unnoticed.
          action: >-
            The OpenTelemetry collector, which carries every service's metrics, logs and traces, is down or
            failing. Read its logs and start it again.
          command: "docker compose logs --tail 200 otel-collector && docker compose up -d otel-collector"

      - alert: ContainerRestarting
        # A container that crashes and is restarted in place keeps its series, so its start time
        # changes. A deploy recreates containers under new ids and does not count.
        expr: |
          sum by (container_label_com_docker_compose_service, name) (
            changes(container_start_time_seconds{name!=""}[15m])
          ) >= 3
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.name }} has crashed and restarted {{ $value }} times in 15 minutes"
          impact: >-
            That part of the platform keeps going down and coming back, so whatever it serves fails on and
            off.
          action: >-
            Read its logs for the error that stops it. If docker inspect shows OOMKilled, it ran out of
            memory: raise its limit (see Memory limits in deploy/README.md).
          command: "docker logs --tail 200 {{ $labels.name }}"

      - alert: ContainerNearMemoryLimit
        # A .NET host has used over 90% of its mem_limit for 10 minutes. There it throws
        # OutOfMemoryException inside the process (its GC heap is capped at 75% of the limit) rather
        # than being killed, so it can fail requests for hours without ever restarting. Only the hosts:
        # Prometheus, Loki and Tempo sit near their caps on reclaimable page cache, which this counts.
        expr: |
          max by (container_label_com_docker_compose_service, name) (
            container_memory_working_set_bytes{container_label_com_docker_compose_service=~"auth|management|client-auth|engine|gateway-ws|gateway-mqtt"}
            / (container_spec_memory_limit_bytes{container_label_com_docker_compose_service=~"auth|management|client-auth|engine|gateway-ws|gateway-mqtt"} > 0)
          ) > 0.9
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.name }} is using {{ $value | humanizePercentage }} of its memory limit"
          impact: >-
            Near its limit a service fails requests with out-of-memory errors, possibly for hours, without
            restarting on its own.
          action: >-
            Either a memory leak or a limit too low for the load. Restart the container to clear it now, and
            raise its limit in .env if the load is real (see Memory limits in deploy/README.md).
          command: "docker stats --no-stream"

      - alert: RabbitMQMemoryAlarm
        # RabbitMQ blocks every publishing connection while its memory alarm is on: client traffic
        # through the gateways, every host's events and the outbox. Its threshold is 60% of the 1 GiB
        # deploy/observability/rabbitmq/memory.conf gives it, about 600 MiB.
        expr: max(rabbitmq_alarms_memory_used_watermark) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "The message broker (RabbitMQ) is out of memory and has stopped accepting messages"
          impact: >-
            Device traffic, events between the services and background work are all blocked. This is a
            platform-wide outage.
          action: >-
            Usually one queue backing up with nothing reading it. Open the RabbitMQ management UI to find
            which, and fix or restart the service that should read it. If the broker is simply too small,
            raise rabbitmq's mem_limit in docker-compose.yml.
          command: "ssh -L 15672:127.0.0.1:15672 <your VM>, then open http://localhost:15672"
