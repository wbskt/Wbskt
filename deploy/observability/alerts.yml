# The handful of conditions that mean a customer is affected or data is at risk. Each one names
# what to look at first. Thresholds are starting points: tune them once there is a baseline.
#
# Deliberately absent: an alert on engine readiness. Only the leader reports ready; a standby is a
# healthy process that is not ready by design, and alerting on it pages for normal behaviour.
# EngineNotReporting below covers "no engine at all".
groups:
  - name: wbskt
    rules:
      - alert: WorkflowRunFailureRateHigh
        expr: |
          (
            sum(increase(wbskt_workflow_runs_completed_total{status=~"Failed|PartiallyFailed"}[15m]))
              / sum(increase(wbskt_workflow_runs_completed_total[15m]))
          ) > 0.25
          and sum(increase(wbskt_workflow_runs_completed_total[15m])) >= 20
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $value | humanizePercentage }} of workflow runs failed over the last 15 minutes"
          description: >-
            Break it down by workspace_id and workflow_ref in Grafana to tell one tenant's broken
            workflow from a platform fault, then follow a failed run's trace in Tempo.

      - alert: WorkflowWakeBacklog
        # Timers and timeouts that fell due over a minute ago and nobody claimed. max, not sum: every
        # engine replica reports the same database-wide count.
        expr: max(wbskt_workflow_bookmarks_overdue) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} workflow wake-ups are overdue and unclaimed"
          description: >-
            The engine leader is stuck, behind, or absent. Check the engine logs and which replica
            holds leadership.

      - alert: WorkflowDispatchBacklog
        expr: max(wbskt_workflow_dispatcher_queue_depth) > 500
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} branches are queued for execution in the engine"

      - alert: MailRelayDown
        # The auth host gave up on at least two mails and sent none in 15 minutes: the relay is refusing
        # everything (expired credential, sending limit, outage, or "relaying denied", which arrives as a
        # refused recipient). Every confirmation, invitation and password reset goes this way, and sign-in
        # needs a confirmed address, so nobody new can get in. Two, so one mistyped address at a quiet
        # hour does not page.
        expr: |
          sum(increase(wbskt_auth_mail_total{outcome=~"dropped|queue_full|rejected"}[15m])) >= 2
          and (sum(increase(wbskt_auth_mail_total{outcome="sent"}[15m])) or vector(0)) == 0
        labels:
          severity: page
        annotations:
          summary: "No mail went out in 15 minutes and {{ $value | printf \"%.0f\" }} were given up on"
          description: >-
            The auth host's "was not sent after" and "was refused by the relay" lines name the relay's
            status code, and for a relay it could not reach, the socket or TLS error under it. This alert is
            mailed through that same relay when ALERT_EMAIL_TO is the only receiver, so it reaches
            someone only with ALERT_WEBHOOK_URL set.

      - alert: MailFailing
        # Some mail was given up on after its retries (about 10 seconds), or refused by a full queue,
        # while other mail still went out: a relay blip, or a backlog building. Quiet while MailRelayDown
        # holds (the same condition, repeated), so one outage notifies once.
        expr: |
          sum(increase(wbskt_auth_mail_total{outcome=~"dropped|queue_full"}[15m])) > 0
          unless on() (
            sum(increase(wbskt_auth_mail_total{outcome=~"dropped|queue_full|rejected"}[15m])) >= 2
            and (sum(increase(wbskt_auth_mail_total{outcome="sent"}[15m])) or vector(0)) == 0
          )
        labels:
          severity: warn
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} outgoing mails were given up on in the last 15 minutes"
          description: >-
            dropped means the relay refused or did not answer through the retries; queue_full means
            wbskt_auth_mail_queue_depth reached its cap. The auth host's error lines carry the relay's
            status code. Users can ask for each message again.

      - alert: BillingWebhooksSetAside
        # A payment webhook that names no tenant here, no plan or pack on offer, or a subscription the
        # provider does not know. For a paying customer that means a tenant left on the wrong plan or
        # without the credits it bought, with nothing else to say so.
        expr: sum by (type) (increase(wbskt_auth_billing_webhooks_total{outcome="set_aside"}[1h])) > 0
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} {{ $labels.type }} payment webhooks were set aside in the last hour"
          description: >-
            Read the reason in dbo.BillingWebhookEvents.LastError (auth database) or the auth host's
            "Set aside" log line. A subscription naming no tenant usually means the checkout's
            metadata did not reach it; a product not on offer means a Billing:Payments product id is
            missing.

      - alert: BillingWebhooksFailing
        # The provider delivers a failed webhook again, so one failure is noise; several in an hour mean
        # the provider's API or the auth database is refusing us.
        expr: sum(increase(wbskt_auth_billing_webhooks_total{outcome="failed"}[1h])) > 5
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} payment webhooks failed in the last hour"
          description: >-
            Check the auth host's logs for the provider's status codes and dbo.BillingWebhookEvents
            for the rows left unprocessed.

      - alert: BillingRefundUnconfirmed
        # A duplicate subscription's refund timed out or the provider answered with an error that does not
        # say nothing happened. It is not asked for again, since that could refund twice, so a person has
        # to check whether the customer got their money back.
        expr: sum(increase(wbskt_auth_billing_refunds_total{outcome="unconfirmed"}[1h])) > 0
        labels:
          severity: warn
        annotations:
          summary: "A duplicate subscription's refund is unconfirmed"
          description: >-
            The auth host's error log names the payment. Look it up in the provider's dashboard and refund
            it by hand if no refund is there. Its claim stays on dbo.TenantSubscriptions
            (DuplicateRefundPaymentId, DuplicateRefundClaimedAt), so the host will not ask again.

      - alert: BillingReconcileFailing
        # The daily reconcile reads the provider's recent subscriptions and payments again in case their
        # webhooks never arrived. One it could not read, or a list it could not read or had to cut short,
        # is tried again the next day, but only while it is inside the three-day window, so about three
        # bad days in a row lose it.
        expr: sum(increase(wbskt_auth_billing_reconciles_total{outcome=~"failed|truncated"}[1d])) > 0
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} subscriptions, payments or lists could not be reconciled in the last day"
          description: >-
            The auth host's "Could not reconcile" and "Could not list" error logs name each one and the
            provider's answer; a truncated list logs "stopped" with the window it was reading.
            Fix the cause before the next day's run, or replay the events from the provider's dashboard.

      - alert: BillingWebhookSignaturesRefused
        # Deliveries that carry a signature which does not hold up usually mean the signing secret was
        # rotated on one side only (a request with no signature is counted apart, as signature_missing).
        # The provider's retries are spread over about a day and events lost then are not sent again, so
        # the window is two hours: wide enough to see a quiet day's few deliveries, short of that day.
        expr: sum(increase(wbskt_auth_billing_webhooks_total{outcome="signature_invalid"}[2h])) > 2
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} payment webhooks were refused for their signature in two hours"
          description: >-
            Compare Billing:Dodo:WebhookSecret on the auth host with the webhook's secret in the
            provider's dashboard. Once fixed, replay the refused deliveries from the dashboard; the
            hourly subscription review re-reads only subscriptions that stayed active past their period.

      - alert: CreditGrantsRepaired
        # The hourly reconcile wrote a credit grant change an event should have: a pack paid for whose
        # credits never arrived, or a refund or chargeback that was not applied. Repaired now, but the
        # event path that lost it needs a look.
        expr: sum by (change) (increase(wbskt_management_credit_grants_repaired_total[2h])) > 0
        labels:
          severity: warn
        annotations:
          summary: "The credit grant reconcile repaired {{ $value }} {{ $labels.change }} change(s)"
          description: >-
            Read the management host's "Repaired the credit grant" log lines for the payments, then
            look for the Tenant credit events in the dead-letter queues and the auth outbox.

      - alert: WorkspaceRunCeilingReached
        # A workspace whose plan already has as many active runs as it allows (PlanLimits.ActiveRuns,
        # pooled across the tenant's workspaces) has its triggers refused (sub-workflow children fail
        # retryably) until runs finish.
        expr: sum by (workspace_id) (increase(wbskt_workflow_runs_refused_total[10m])) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Workspace {{ $labels.workspace_id }} is refusing triggers at its active-run ceiling"
          description: >-
            Look for runs piling up in that workspace (a stuck wait, a trigger firing far faster
            than its runs finish). If the load is legitimate, the tenant needs a bigger plan or a
            limit override.

      - alert: DeadLetteredMessages
        # MassTransit moves a message that exhausted its retries to <queue>_error, and one with no
        # consumer to <queue>_skipped. Either is an event some host never handled.
        expr: sum by (queue) (rabbitmq_detailed_queue_messages_ready{queue=~".+_(error|skipped)"}) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} messages dead-lettered in {{ $labels.queue }}"
          description: >-
            Inspect them in the RabbitMQ management UI (or the logs for the consumer's exception),
            fix the cause, then move them back to the source queue.

      - alert: CallbackQueueBacklog
        # Public webhooks and wakes wait here for the engine. The broker caps the queue at 10,000
        # callbacks or 64 MiB, whichever comes first (deploy/observability/rabbitmq/healthcheck.sh);
        # once full, callers get 503s. This fires at a tenth of the count, CallbackQueueBytesBacklog
        # at a tenth of the bytes.
        expr: max(rabbitmq_detailed_queue_messages_ready{queue="workflow-inbound-callback"}) > 1000
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} public callbacks are waiting for the workflow engine"
          description: >-
            The engine is down or not keeping up. At 10,000 callbacks or 64 MiB the queue refuses
            more and webhook callers are answered 503 until it drains.

      - alert: CallbackQueueBytesBacklog
        # Webhook bodies can be up to 128 KiB, so about 512 large callbacks fill the 64 MiB cap long
        # before the count alert above sees 1,000. Needs the queue_metrics family (prometheus.yml).
        expr: max(rabbitmq_detailed_queue_messages_ready_bytes{queue="workflow-inbound-callback"}) > 6 * 1024 * 1024
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value | humanize1024 }}B of public callbacks are waiting for the workflow engine"
          description: >-
            The engine is down or not keeping up. At 64 MiB (or 10,000 callbacks) the queue refuses
            more and webhook callers are answered 503 until it drains.

      - alert: SocketDisconnectRateHigh
        # Abnormal disconnects only: client_closed is a client signing off, server_stopping a deploy.
        # Per transport, so a WebSocket or MQTT tier in trouble is not hidden by the other's clients.
        expr: |
          sum by (transport) (increase(wbskt_socket_disconnects_total{reason=~"aborted|error"}[10m]))
            / clamp_min(sum by (transport) (wbskt_socket_connections_open), 10)
          > 0.5
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Clients are dropping off the {{ $labels.transport }} gateway faster than usual"
          description: >-
            More abnormal disconnects in 10 minutes than half the connected clients on this transport.
            Look for a network or proxy problem in front of ws.<domain> (websocket) or mqtt.<domain>
            (mqtt), or a gateway host restarting.

      - alert: RevokeMissedByGateway
        # The gateway's access re-check closed a connection whose revoke, delete or secret rotation
        # event never reached it: the client stayed connected until the re-check, up to a minute.
        expr: sum by (transport) (increase(wbskt_socket_access_recheck_closed_total[15m])) > 0
        labels:
          severity: warn
        annotations:
          summary: "A {{ $labels.transport }} gateway missed {{ $value | humanize }} client revoke events"
          description: >-
            The gateway's broker connection dropped while a client lost access, so the event was
            discarded with its auto-delete queue; the access re-check closed the connection instead.
            Look at RabbitMQ connection churn for the gateway around that time.

      - alert: DeletedWorkspaceRetiredBySweep
        # Management's daily deleted workspace sweep found a workspace the auth host had deleted that
        # still had live policies, clients, workflows or runs, and retired it. Each one is a
        # WorkspaceDeletedEvent that was lost or whose handling gave up. 25h: one daily sweep's worth.
        expr: sum(increase(wbskt_management_workspaces_retired_by_sweep_total[25h])) > 0
        labels:
          severity: warn
        annotations:
          summary: "The deleted workspace sweep retired {{ $value }} workspace(s) the delete event missed"
          description: >-
            The sweep has already repaired them. Find out why the event did not: the management
            log's "was deleted but still had live content" warning names each workspace, and a
            WorkspaceDeletedEvent dead-lettered in a management _error queue is the usual cause.

      - alert: BackupMissing
        # backup.sh pushes this timestamp only after a verified backup has been uploaded.
        expr: time() - max(wbskt_backup_last_success_timestamp_seconds) > 26 * 3600
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "No successful database backup for over 26 hours"
          description: Check /var/log/wbskt-backup.log on the VM and that the cron entry still exists.

      - alert: BackupNeverReported
        expr: absent(wbskt_backup_last_success_timestamp_seconds)
        for: 26h
        labels:
          severity: page
        annotations:
          summary: "The backup job has never reported a success to this Prometheus"

      - alert: DatabaseNearExpressLimit
        # backup.sh pushes each database's allocated data-file size nightly. SQL Server Express caps
        # a database's data at 10 GB, and past it every insert that needs a new page fails.
        expr: max by (database) (wbskt_sql_data_file_bytes) > 8 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.database }} has {{ $value | humanize1024 }}B of data files, near the Express limit of 10 GiB"
          description: >-
            Find what grew (sp_spaceused per table). If it is free space left by deleted rows, shrink
            the file once (DBCC SHRINKFILE); if it is real data, plan the move off Express before the
            database reaches 10 GB. See "SQL Server edition" in deploy/README.md.

      - alert: DatabaseAtExpressLimit
        # Past the warning and still growing: at 10 GB every insert needing a new page fails, which
        # stops readings, runs and audit for every customer at once, so this one wakes someone.
        expr: max by (database) (wbskt_sql_data_file_bytes) > 9 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.database }} has {{ $value | humanize1024 }}B of data files; Express stops writes at 10 GiB"
          description: >-
            Same steps as DatabaseNearExpressLimit, now urgent: shrink the file if it is free space, or
            trim readings retention and move off Express. See "SQL Server edition" in deploy/README.md.

      - alert: EngineNotReporting
        expr: absent(wbskt_workflow_dispatcher_queue_depth)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No workflow engine has reported metrics for 5 minutes"

      - alert: HostNotReporting
        # A host that stopped, hangs, or lost its exporter sends nothing, and nothing else would say so:
        # only the engine had a rule. target_info comes with every push (job = OTEL_SERVICE_NAME), and
        # dotnet_process_cpu_count from the runtime meter, so either is there while the host is up. The
        # engine is EngineNotReporting's.
        expr: |
          absent({__name__=~"target_info|dotnet_process_cpu_count", job="wbskt-auth"})
          or absent({__name__=~"target_info|dotnet_process_cpu_count", job="wbskt-management"})
          or absent({__name__=~"target_info|dotnet_process_cpu_count", job="wbskt-client-auth"})
          or absent({__name__=~"target_info|dotnet_process_cpu_count", job="wbskt-gateway-ws"})
          or absent({__name__=~"target_info|dotnet_process_cpu_count", job="wbskt-gateway-mqtt"})
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.job }} has reported no metrics for 5 minutes"
          description: >-
            docker compose ps and docker compose logs --tail 200 for that service on the VM show whether
            it is down or only its telemetry is. When every host fires at once, look at OtelCollectorDown.

      - alert: PeriodicJobFailing
        # A periodic job (credit posting, reconciles, retention, the deleted-workspace sweep) logs a
        # failed tick and carries on, so one that fails every time stays quiet. Either it failed more
        # than three times in 30 minutes (the jobs that run every few minutes), or it failed and has
        # not once succeeded in 6 hours (hourly jobs) or 49 hours (daily ones). Per instance, so a
        # failing replica is not hidden by a healthy one; a standby engine's skipped ticks count as
        # neither.
        expr: |
          sum by (job, instance, worker) (increase({__name__=~"wbskt_(auth|management|workflow)_worker_ticks_total", outcome="failed"}[30m])) > 3
          or (
            sum by (job, instance, worker) (increase({__name__=~"wbskt_(auth|management|workflow)_worker_ticks_total", outcome="failed"}[6h])) > 0
            unless on (job, instance, worker) sum by (job, instance, worker) (increase({__name__=~"wbskt_(auth|management|workflow)_worker_ticks_total", outcome="ok"}[6h])) > 0
          )
          or (
            sum by (job, instance, worker) (increase({__name__=~"wbskt_(auth|management|workflow)_worker_ticks_total", outcome="failed"}[49h])) > 0
            unless on (job, instance, worker) sum by (job, instance, worker) (increase({__name__=~"wbskt_(auth|management|workflow)_worker_ticks_total", outcome="ok"}[49h])) > 0
          )
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.worker }} on {{ $labels.job }} keeps failing"
          description: >-
            Its error lines name the failure: docker compose logs for that service, or Loki with
            {service_name="{{ $labels.job }}"} |= "{{ $labels.worker }}". The job runs again on its own
            once the cause is fixed.

      - alert: DiskAlmostFull
        # Every real filesystem on the VM: /, and the image store or SQL volume if they are separate.
        # At 15% free a deploy's pull or a SQL Server autogrow is close to failing.
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}
          < 0.15
          and node_filesystem_readonly == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.mountpoint }} on the VM has {{ $value | humanizePercentage }} free"
          description: >-
            Follow "Disk space" in deploy/README.md: find what grew with docker system df and du,
            prune unused images, vacuum the journal. Never prune volumes.

      - alert: DiskFillingFast
        # Early warning: at the last six hours' rate, the filesystem is full within a day.
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.40
          and node_filesystem_readonly == 0
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.mountpoint }} on the VM will be full within 24 hours at the current rate"
          description: Look for a runaway log, local backups piling up, or images not being pruned.

      - alert: NodeExporterDown
        # Without it the two disk alerts above can never fire.
        expr: absent(up{job="node"} == 1)
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Prometheus cannot scrape node-exporter, so disk space is unwatched"

      - alert: OtelCollectorDown
        # Every host sends traces, metrics and logs through it, so while it is down EngineNotReporting
        # and the workflow alerts go quiet too. It has no Docker healthcheck to show this instead.
        expr: absent(up{job="otel-collector"} == 1)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape the OpenTelemetry collector, so no host telemetry is arriving"
          description: docker compose logs --tail 200 otel-collector on the VM shows why.

      - alert: ContainerRestarting
        # A container that crashes and is restarted in place keeps its series, so its start time
        # changes. A deploy recreates containers under new ids and does not count.
        expr: |
          sum by (container_label_com_docker_compose_service, name) (
            changes(container_start_time_seconds{name!=""}[15m])
          ) >= 3
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.name }} restarted {{ $value }} times in 15 minutes"
          description: >-
            It is crash-looping. docker logs --tail 200 {{ $labels.name }} on the VM shows why; a
            container stopped by its memory limit shows OOMKilled in docker inspect.
