# One door in for every host's telemetry: traces to Tempo, metrics to Prometheus, logs to Loki.
# The hosts know only OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317, so swapping a backend
# (or adding a hosted one alongside) is a change here, not in four services.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Drops data rather than letting the collector be OOM-killed when a backend stalls.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  # Its own metrics, for Prometheus to scrape: the image has no shell or HTTP client, so this is
  # the only way to tell it is alive (OtelCollectorDown). The default listens on localhost only.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
