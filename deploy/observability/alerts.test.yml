# Unit tests for alerts.yml, run in CI by promtool (test rules). Each alert that guards the stack's
# own monitoring is tested both ways: it fires on the failure it is for, and stays quiet otherwise.
# promtool compares annotations exactly, so rewording one in alerts.yml means rewording it here; the
# failure prints the text it got. A rule that names a metric the code no longer emits still passes
# these; AlertMetricNamesTests in Tests/Wbskt.Host.Tests catches that.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # Watchdog fires from the first evaluation, with nothing else running.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              action: "Nothing to do. Never silence it, or the outside service decides the VM is down."
              impact: "None. It is never emailed: it goes only to the dead man's switch (ALERT_DEADMANS_URL), so a service outside the VM notices when alerts stop being sent."
              summary: "The alerting pipeline is working; this alert always fires"

  # The email receiver keeps failing: AlertNotificationsFailing, named for it. A failure that stopped
  # more than 30 minutes ago is quiet.
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", integration="email", reason="other"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: AlertNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: page
              integration: email
            exp_annotations:
              summary: "Alerts are failing to be delivered by email"
              impact: "Alerts sent by this channel are not reaching anyone, so the problems they report could go unnoticed. The dead man's switch stops being pinged while this lasts, so the outside service reports it too."
              action: "Read Alertmanager's log for the receiver's error: often an expired SMTP password or a webhook URL that was revoked. Fix ALERT_EMAIL_TO, ALERT_WEBHOOK_URL, ALERT_DEADMANS_URL or the SMTP_* settings in .env, then recreate alertmanager."
              command: "docker compose logs --since 1h alertmanager | grep -i notify"
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", integration="email", reason="other"}'
        values: '0+1x5 5x60'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", integration="webhook", reason="other"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: AlertNotificationsFailing
        exp_alerts: []

  # Mail keeps failing and none is sent: MailRelayDown. Failures with mail still going out: quiet.
  - interval: 1m
    input_series:
      - series: 'wbskt_auth_mail_total{job="wbskt-auth", outcome="retried"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MailRelayDown
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              action: "The mail relay is refusing everything or cannot be reached: often an expired password, a sending limit, or the provider being down. The auth host's \"failed on attempt\", \"was not sent\" and \"was refused by the relay\" log lines carry the relay's error code. Mail that failed is tried again for about eight hours (a link that expires sooner, such as a password reset, only until then), so fixing the relay soon still delivers it. If the SMTP_* settings in .env changed, fix them and restart auth. This alert is mailed through that same relay, so it reaches anyone only when ALERT_WEBHOOK_URL is set too."
              command: "docker compose logs --since 1h auth | grep -E \"failed on attempt|was not sent|refused by the relay\""
              impact: "Sign-up confirmations, invitations and password resets are not being delivered. New users cannot confirm their address, so they cannot sign in."
              summary: "Outgoing email has stopped: none sent in 15 minutes, 15 given up on"
  - interval: 1m
    input_series:
      - series: 'wbskt_auth_mail_total{job="wbskt-auth", outcome="retried"}'
        values: '0+1x30'
      - series: 'wbskt_auth_mail_total{job="wbskt-auth", outcome="sent"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MailRelayDown
        exp_alerts: []

  # The auth host stops pushing after 10 minutes. Its series goes stale 5 minutes later, and the
  # alert fires 5 minutes after that. The others keep pushing and are not named.
  - interval: 1m
    input_series:
      - series: 'target_info{job="wbskt-auth", instance="auth-1"}'
        values: '1x10'
      - series: 'target_info{job="wbskt-management", instance="management-1"}'
        values: '1x40'
      - series: 'dotnet_process_cpu_count{job="wbskt-client-auth", instance="client-auth-1"}'
        values: '2x40'
      - series: 'target_info{job="wbskt-gateway-ws", instance="gateway-ws-1"}'
        values: '1x40'
      - series: 'target_info{job="wbskt-gateway-mqtt", instance="gateway-mqtt-1"}'
        values: '1x40'
      - series: 'up{job="otel-collector", instance="otel-collector:8888"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostNotReporting
        exp_alerts: []
      - eval_time: 25m
        alertname: HostNotReporting
        exp_alerts:
          - exp_labels:
              severity: page
              job: wbskt-auth
            exp_annotations:
              action: "Check whether it is running and read its recent logs. A service deliberately scaled to 0 replicas fires this too."
              command: "docker compose --profile admin ps auth && docker compose --profile admin logs --tail 200 auth"
              impact: "Either that service is down, so what it does (sign-in for auth, the console's API for management, device connections for client-auth and the gateways) is failing, or it is running but its monitoring is broken."
              summary: "The auth service has been silent for about 10 minutes"

  # The platform admin counts only where its container runs: silent with a container, it fires;
  # with none (the admin profile not deployed), the same silence is quiet.
  - interval: 1m
    input_series:
      - series: 'target_info{job="wbskt-auth", instance="auth-1"}'
        values: '1x40'
      - series: 'target_info{job="wbskt-management", instance="management-1"}'
        values: '1x40'
      - series: 'target_info{job="wbskt-client-auth", instance="client-auth-1"}'
        values: '1x40'
      - series: 'target_info{job="wbskt-gateway-ws", instance="gateway-ws-1"}'
        values: '1x40'
      - series: 'target_info{job="wbskt-gateway-mqtt", instance="gateway-mqtt-1"}'
        values: '1x40'
      - series: 'up{job="otel-collector", instance="otel-collector:8888"}'
        values: '1x40'
      - series: 'container_memory_working_set_bytes{job="cadvisor", name="wbskt-admin", container_label_com_docker_compose_service="admin"}'
        values: '100000000x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostNotReporting
        exp_alerts:
          - exp_labels:
              severity: page
              job: wbskt-admin
            exp_annotations:
              action: "Check whether it is running and read its recent logs. A service deliberately scaled to 0 replicas fires this too."
              command: "docker compose --profile admin ps admin && docker compose --profile admin logs --tail 200 admin"
              impact: "Either that service is down, so what it does (sign-in for auth, the console's API for management, device connections for client-auth and the gateways) is failing, or it is running but its monitoring is broken."
              summary: "The admin service has been silent for about 10 minutes"
  - interval: 1m
    input_series:
      - series: 'target_info{job="wbskt-auth", instance="auth-1"}'
        values: '1x40'
      - series: 'target_info{job="wbskt-management", instance="management-1"}'
        values: '1x40'
      - series: 'target_info{job="wbskt-client-auth", instance="client-auth-1"}'
        values: '1x40'
      - series: 'target_info{job="wbskt-gateway-ws", instance="gateway-ws-1"}'
        values: '1x40'
      - series: 'target_info{job="wbskt-gateway-mqtt", instance="gateway-mqtt-1"}'
        values: '1x40'
      - series: 'up{job="otel-collector", instance="otel-collector:8888"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostNotReporting
        exp_alerts: []

  # With the collector down every host goes silent at once; that is OtelCollectorDown's alert, so
  # HostNotReporting holds back.
  - interval: 1m
    input_series:
      - series: 'up{job="otel-collector", instance="otel-collector:8888"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: HostNotReporting
        exp_alerts: []

  # A job that has failed every tick since its container started fires; one that also succeeds, or
  # whose container stopped pushing, does not.
  - interval: 1m
    input_series:
      - series: 'wbskt_management_worker_ticks_total{job="wbskt-management", instance="management-1", worker="CreditPosting", outcome="failed"}'
        values: '1+1x30'
      - series: 'wbskt_management_worker_ticks_total{job="wbskt-management", instance="management-1", worker="Retention", outcome="failed"}'
        values: '1+1x30'
      - series: 'wbskt_management_worker_ticks_total{job="wbskt-management", instance="management-1", worker="Retention", outcome="ok"}'
        values: '1+1x30'
      - series: 'wbskt_auth_worker_ticks_total{job="wbskt-auth", instance="auth-1", worker="BillingReconcile", outcome="failed"}'
        values: '1+1x30'
      - series: 'target_info{job="wbskt-management", instance="management-1"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: PeriodicJobFailing
        exp_alerts: []
      - eval_time: 15m
        alertname: PeriodicJobFailing
        exp_alerts:
          - exp_labels:
              severity: warn
              job: wbskt-management
              instance: management-1
              worker: CreditPosting
            exp_annotations:
              action: "Its error lines name the failure: the service's logs, or Loki in Grafana with {service_name=\"wbskt-management\"} |= \"CreditPosting\". It runs again on its own once the cause is fixed."
              command: "docker compose logs --since 1h management | grep \"CreditPosting\""
              impact: "A scheduled job (credit posting, billing checks, data retention, the deleted-workspace cleanup, or device access re-checks) is not doing its work. What breaks depends on the job, and usually builds up slowly."
              summary: "The background job CreditPosting on management keeps failing"

  # Messages land in an error queue: DeadLetteredMessages, for an hour after the last one arrives.
  - interval: 1m
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{job="rabbitmq", queue="ClientPresenceHandler_error"}'
        values: '4x60 6x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: DeadLetteredMessages
        exp_alerts:
          - exp_labels:
              severity: page
              queue: ClientPresenceHandler_error
            exp_annotations:
              summary: "Background messages failed in the last hour and were set aside in ClientPresenceHandler_error, 6 there now"
              impact: "Work the platform does between its services was not done: depending on the queue, a device update, a billing change or a workflow event never happened."
              action: "In the RabbitMQ management UI, read the messages in that queue, and read the logs of the service that consumes it for the exception. Fix the cause, then move the messages back to the original queue (the same name without _error or _skipped) so they are processed, or purge them if they are stale. The alert clears an hour after the last new message, whether or not the queue is emptied."
              command: "ssh -L 15672:127.0.0.1:15672 <your VM>, then open http://localhost:15672"
      - eval_time: 170m
        alertname: DeadLetteredMessages
        exp_alerts: []

  # A queue that appears holding messages fires; old messages that stay where they are do not.
  - interval: 1m
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{job="rabbitmq", queue="SocketHostHeartbeatHandler_error"}'
        values: '_x90 3x30'
      - series: 'rabbitmq_detailed_queue_messages_ready{job="rabbitmq", queue="ClientMetadataIngestionHandler_error"}'
        values: '124x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: DeadLetteredMessages
        exp_alerts:
          - exp_labels:
              severity: page
              queue: SocketHostHeartbeatHandler_error
            exp_annotations:
              summary: "Background messages failed in the last hour and were set aside in SocketHostHeartbeatHandler_error, 3 there now"
              impact: "Work the platform does between its services was not done: depending on the queue, a device update, a billing change or a workflow event never happened."
              action: "In the RabbitMQ management UI, read the messages in that queue, and read the logs of the service that consumes it for the exception. Fix the cause, then move the messages back to the original queue (the same name without _error or _skipped) so they are processed, or purge them if they are stale. The alert clears an hour after the last new message, whether or not the queue is emptied."
              command: "ssh -L 15672:127.0.0.1:15672 <your VM>, then open http://localhost:15672"
