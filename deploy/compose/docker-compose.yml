name: wbskt

networks:
  # Fixed subnets so auth/management can pin ForwardedHeadersOptions.KnownProxies to Traefik's
  # own address instead of trusting X-Forwarded-For/Proto from any container on the network.
  # ip_range confines Docker's automatic allocation to the upper half of each subnet. Without it
  # the allocator hands out .2 upward to whichever container starts first, and Traefik - which
  # starts last, since everything else is a dependency - finds its pinned .2 already taken and
  # dies with "Address already in use". Static pins must sit outside the dynamic pool.
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25
  backend:
    ipam:
      config:
        - subnet: 172.28.1.0/24
          ip_range: 172.28.1.128/25

volumes:
  sql-data:
  rabbitmq-data:
  redis-data:
  traefik-acme:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  grafana-data:

# Every container's stdout is capped. Docker's default json-file driver never rotates, so on one VM
# a chatty host eventually fills the disk SQL Server writes to. Logs worth keeping longer go to Loki.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-host-env: &host-env
  ASPNETCORE_ENVIRONMENT: Production
  RabbitMQ__HostName: rabbitmq
  RabbitMQ__UserName: ${RABBITMQ_USER}
  RabbitMQ__Password: ${RABBITMQ_PASSWORD}
  # Traces, metrics and logs, all to the collector below. Each service sets its own OTEL_SERVICE_NAME.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:
  traefik:
    # v3.1/v3.5 fail against recent Docker Engine releases (their vendored Docker client
    # hardcodes an old API version instead of negotiating; confirmed by direct testing).
    # v3.7 negotiates correctly.
    image: traefik:v3.7
    container_name: wbskt-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      # Pin which container network Traefik dials targets on; without this it picks one
      # arbitrarily from the container's networks and only works while Traefik happens to be
      # attached to it. Services not on edge (engine) override via traefik.docker.network.
      - --providers.docker.network=wbskt_edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=0
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0
      # Internal-only entrypoint for the engine's api/inbound/*; never published to the host,
      # only reachable by other containers as http://traefik:8081.
      - --entrypoints.engine.address=:8081
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # Defaults to production Let's Encrypt; set ACME_CASERVER to the staging directory
      # (https://acme-staging-v02.api.letsencrypt.org/directory) while iterating, to avoid
      # tripping production rate limits.
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks:
      edge:
        ipv4_address: 172.28.0.2
      backend:
        ipv4_address: 172.28.1.2
    restart: unless-stopped
    logging: *default-logging

  console:
    # No build: key - the console is an artifact of the Dashboard repo, which owns its Dockerfile
    # and publishes this image itself. Deploy it with `deploy.sh --console-tag <tag>`, which moves
    # CONSOLE_IMAGE_TAG independently of the backend's IMAGE_TAG.
    image: ${REGISTRY:-ghcr.io/wbskt}/wbskt-console:${CONSOLE_IMAGE_TAG:-latest}
    container_name: wbskt-console
    # The console image ships no URLs of its own; its entrypoint writes these into a config.json
    # the Angular app fetches before bootstrapping. They are browser-facing, so they must be the
    # public hostnames - not the internal service names the backend containers use to reach
    # each other.
    environment:
      AUTH_URL: https://auth.${DOMAIN}
      WORKSPACE_URL: https://api.${DOMAIN}
      NOTIFICATIONS_URL: https://api.${DOMAIN}/hubs/notifications
    healthcheck:
      # 127.0.0.1, not localhost: the container's /etc/hosts maps localhost to both 127.0.0.1 and
      # ::1, busybox wget tries ::1 first, and nginx only listens on IPv4 - so `localhost` fails
      # even though the server is fine. That marks the container unhealthy, and Traefik silently
      # drops unhealthy containers from its routing table, which surfaces as a 404 on the site
      # and no certificate ever being requested.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [edge]
    restart: unless-stopped
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.console.rule=Host(`console.${DOMAIN}`)
      - traefik.http.routers.console.entrypoints=websecure
      - traefik.http.routers.console.tls.certresolver=letsencrypt
      - traefik.http.services.console.loadbalancer.server.port=80

  auth:
    # Backend services carry both image: and build:. On the VM, deploy/scripts/deploy.sh pulls the
    # tag CI published and passes --no-build; locally, `docker compose build` still works and just
    # tags the result under the same name.
    image: ${REGISTRY:-ghcr.io/wbskt}/wbskt-auth:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        HOST_PROJECT: Hosts/Wbskt.Auth.Host/Wbskt.Auth.Host.csproj
        HOST_DLL: Wbskt.Auth.Host.dll
    environment:
      <<: *host-env
      OTEL_SERVICE_NAME: wbskt-auth
      # Serves /scalar and /openapi/v1.json anonymously when true. Off unless set in .env.
      ApiDocs__Enabled: ${API_DOCS_ENABLED:-false}
      ConnectionStrings__AuthDBConnection: Server=sql;Database=Wbskt.Database.Auth;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;
      # Signs user tokens. Its public half is served at /.well-known/jwks.json for management.
      Jwt__SigningKey: ${AUTH_JWT_SIGNING_KEY:?AUTH_JWT_SIGNING_KEY is required - see .env.example}
      Jwt__AdditionalPublicKeys__0: ${AUTH_JWT_PREVIOUS_PUBLIC_KEY:-}
      # Publishes access-token revocations (logout-all, deactivation, password reset) to management.
      ConnectionStrings__Redis: redis:6379
      Cors__AllowedOrigins__0: ${CONSOLE_ORIGIN}
      Cors__ExtraOrigins: ${CORS_EXTRA_ORIGINS:-}
      # Mail. Leave SMTP_HOST empty and the host logs an error at startup and sends nothing - which,
      # because sign-in requires a confirmed address, means no new account can be used. The links in
      # that mail point at the console's public origin, never at an inbound Host header.
      Auth__Email__Host: ${SMTP_HOST:-}
      Auth__Email__Port: ${SMTP_PORT:-587}
      Auth__Email__UseStartTls: ${SMTP_USE_STARTTLS:-true}
      Auth__Email__UserName: ${SMTP_USERNAME:-}
      Auth__Email__Password: ${SMTP_PASSWORD:-}
      Auth__Email__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Auth__Email__FromDisplayName: ${SMTP_FROM_NAME:-Wbskt}
      Auth__Email__ConsoleBaseUrl: ${CONSOLE_ORIGIN}
    volumes:
      - ../config:/Config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      rabbitmq:
        condition: service_healthy
      sql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, backend]
    restart: unless-stopped
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.routers.auth.tls.certresolver=letsencrypt
      - traefik.http.services.auth.loadbalancer.server.port=8080

  management:
    image: ${REGISTRY:-ghcr.io/wbskt}/wbskt-management:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        HOST_PROJECT: Hosts/Wbskt.Management.Host/Wbskt.Management.Host.csproj
        HOST_DLL: Wbskt.Management.Host.dll
    environment:
      <<: *host-env
      OTEL_SERVICE_NAME: wbskt-management
      ApiDocs__Enabled: ${API_DOCS_ENABLED:-false}
      ConnectionStrings__DefaultConnection: Server=sql;Database=Wbskt.Database;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;
      ConnectionStrings__Redis: redis:6379
      # Signs client tokens for the socket host, and validates user tokens against auth's public keys.
      Jwt__SigningKey: ${MANAGEMENT_JWT_SIGNING_KEY:?MANAGEMENT_JWT_SIGNING_KEY is required - see .env.example}
      Jwt__AdditionalPublicKeys__0: ${MANAGEMENT_JWT_PREVIOUS_PUBLIC_KEY:-}
      Jwt__TrustedJwksUrl: http://auth:8080/.well-known/jwks.json
      Services__Auth: http://auth:8080
      Services__WorkflowEngine: http://traefik:8081
      Services__WorkflowEngineApiKey: ${ENGINE_INBOUND_API_KEY}
      Cors__AllowedOrigins__0: ${CONSOLE_ORIGIN}
      Cors__ExtraOrigins: ${CORS_EXTRA_ORIGINS:-}
    volumes:
      - ../config:/Config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      rabbitmq:
        condition: service_healthy
      sql:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks: [edge, backend]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      replicas: ${MANAGEMENT_REPLICAS:-1}
    labels:
      - traefik.enable=true
      - traefik.http.routers.management.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.management.entrypoints=websecure
      - traefik.http.routers.management.tls.certresolver=letsencrypt
      - traefik.http.services.management.loadbalancer.server.port=8080
      # SignalR negotiate affinity across scaled instances.
      - traefik.http.services.management.loadbalancer.sticky.cookie=true
      - traefik.http.services.management.loadbalancer.sticky.cookie.secure=true
      - traefik.http.services.management.loadbalancer.sticky.cookie.httpOnly=true

  socket:
    image: ${REGISTRY:-ghcr.io/wbskt}/wbskt-socket:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        HOST_PROJECT: Hosts/Wbskt.Socket.Host/Wbskt.Socket.Host.csproj
        HOST_DLL: Wbskt.Socket.Host.dll
    environment:
      <<: *host-env
      OTEL_SERVICE_NAME: wbskt-socket
      ApiDocs__Enabled: ${API_DOCS_ENABLED:-false}
      # Signs nothing; validates client tokens against management's public keys, fetched on first use.
      Jwt__TrustedJwksUrl: http://management:8080/.well-known/jwks.json
    volumes:
      - ../config:/Config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [edge, backend]
    restart: unless-stopped
    logging: *default-logging
    # Declared rather than left to `--scale`, because `docker compose up -d socket` converges to
    # whatever is declared here - a deploy that omitted --scale would silently drop a 3-replica
    # tier back to 1.
    deploy:
      replicas: ${SOCKET_REPLICAS:-1}
    labels:
      - traefik.enable=true
      - traefik.http.routers.socket.rule=Host(`ws.${DOMAIN}`)
      - traefik.http.routers.socket.entrypoints=websecure
      - traefik.http.routers.socket.tls.certresolver=letsencrypt
      - traefik.http.services.socket.loadbalancer.server.port=8080
      # No stickiness needed: per-instance fan-out (WP2) means every instance can route commands
      # to any client it doesn't hold, and WebSocket upgrade pins the TCP connection natively.

  engine:
    image: ${REGISTRY:-ghcr.io/wbskt}/wbskt-engine:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        HOST_PROJECT: Hosts/Wbskt.Workflow.Engine.Host/Wbskt.Workflow.Engine.Host.csproj
        HOST_DLL: Wbskt.Workflow.Engine.Host.dll
    environment:
      <<: *host-env
      OTEL_SERVICE_NAME: wbskt-engine
      ConnectionStrings__DefaultConnection: Server=sql;Database=Wbskt.Database;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;
      Engine__InboundApiKey: ${ENGINE_INBOUND_API_KEY}
    volumes:
      - ../config:/Config:ro
    # Liveness, not readiness - the exception among the four hosts. A standby engine is a healthy
    # process that is deliberately not ready, so a readiness probe here would mark every standby
    # replica unhealthy and hang deploy.sh's wait_for_health once ENGINE_REPLICAS > 1. Routing to
    # the leader is already handled independently by the Traefik loadbalancer healthcheck below,
    # which points at /healthz/ready.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      rabbitmq:
        condition: service_healthy
      sql:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging
    # Keep at 1 until the engine remediation prerequisite lands (Docs\Workflow.Engine.V3.Remediation.Plan.md).
    deploy:
      replicas: ${ENGINE_REPLICAS:-1}
    labels:
      - traefik.enable=true
      - traefik.http.routers.engine.rule=PathPrefix(`/api/inbound`)
      - traefik.http.routers.engine.entrypoints=engine
      # Engine is backend-only, so override the provider-level wbskt_edge default.
      - traefik.docker.network=wbskt_backend
      - traefik.http.services.engine.loadbalancer.server.port=8080
      # Only the leader reports ready (see LeadershipState/EngineLeadershipCoordinator), so
      # Traefik's active health check is what actually routes traffic to the current leader.
      - traefik.http.services.engine.loadbalancer.healthcheck.path=/healthz/ready
      - traefik.http.services.engine.loadbalancer.healthcheck.interval=5s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: wbskt-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Adds rabbitmq_prometheus (port 15692, backend network only) for the dead-letter alert.
      - ../observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7
    container_name: wbskt-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wbskt-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging


  # --- Observability -------------------------------------------------------------------------------
  # Nothing here is on the edge network or behind Traefik. Grafana, Alertmanager and the
  # Pushgateway are published on the VM's loopback only; reach Grafana with
  #   ssh -L 3000:127.0.0.1:3000 <vm>   and open http://localhost:3000
  # See "Observability" in deploy/README.md.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    container_name: wbskt-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [prometheus, loki, tempo]
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: wbskt-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${METRICS_RETENTION:-15d}
      - --web.enable-otlp-receiver
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: wbskt-alertmanager
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
    volumes:
      - ../observability/alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    # Loopback only: deploy/scripts/alert.sh posts backup failures here from the VM itself.
    ports:
      - "127.0.0.1:9093:9093"
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  pushgateway:
    image: prom/pushgateway:v1.11.1
    container_name: wbskt-pushgateway
    # Loopback only: backup.sh runs from cron on the VM and pushes its success timestamp here.
    ports:
      - "127.0.0.1:9091:9091"
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: grafana/loki:3.5.3
    container_name: wbskt-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.8.2
    container_name: wbskt-tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.1.1
    container_name: wbskt-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required - see .env.example}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki, tempo]
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  migrator:
    image: ${REGISTRY:-ghcr.io/wbskt}/wbskt-migrator:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.migrator
    container_name: wbskt-migrator
    profiles: ["migrate"]
    environment:
      AUTH_DB_CONNECTION_STRING: Server=sql;Database=Wbskt.Database.Auth;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;
      DEFAULT_DB_CONNECTION_STRING: Server=sql;Database=Wbskt.Database;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;
      # Both interpolate from the invoking shell (e.g. `MIGRATE_FRESH=true docker compose run ...`);
      # a literal value here would ignore the shell and make the documented commands silent no-ops.
      # MIGRATE_FRESH=true drops and recreates both DBs - only ever for a brand-new environment.
      # MIGRATE_ALLOW_DATA_LOSS=true lets sqlpackage apply schema changes that destroy existing
      # rows (column drops/narrowing) on an incremental run - see deploy/README.md.
      MIGRATE_FRESH: ${MIGRATE_FRESH:-false}
      MIGRATE_ALLOW_DATA_LOSS: ${MIGRATE_ALLOW_DATA_LOSS:-false}
    depends_on:
      sql:
        condition: service_healthy
    networks: [backend]
