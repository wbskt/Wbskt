[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wbskt"
dynamic = ["version"]
description = "Connect a Raspberry Pi, script or service to Wbskt: register with a policy PIN, hold a WebSocket open, send readings and receive commands."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wbskt" }]
keywords = ["wbskt", "iot", "websocket", "raspberry-pi", "devices"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Home Automation",
  "Framework :: AsyncIO",
]
dependencies = ["websockets>=13"]

[project.urls]
Homepage = "https://wbskt.com"
Source = "https://github.com/wbskt/Wbskt/tree/master/Clients/python"
Protocol = "https://github.com/wbskt/Wbskt/blob/master/Docs/Device.Protocol.md"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.version]
path = "src/wbskt/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wbskt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
